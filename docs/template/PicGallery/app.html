<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工作台 · Pic Gallery</title>
  <style>
    :root {
      /* Luminous Vault Theme */
      --bg:      oklch(12% 0.015 260);
      --surface: oklch(16% 0.02 260);
      --fg:      oklch(95% 0.01 80);
      --muted:   oklch(90% 0.01 80 / 0.68);
      --border:  oklch(100% 0 0 / 0.1);
      --accent:  oklch(70% 0.12 75);
      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);

      --font-display: 'Cormorant Garamond', serif;
      --font-body:    'Manrope', system-ui, sans-serif;
      --font-mono:    'JetBrains Mono', monospace;

      --sidebar-w: 108px;
      --topbar-h: 76px;
      --panel-w: 420px;
      --radius: 12px;
      --radius-lg: 18px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      overflow: hidden; /* App view */
      height: 100vh;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-block: 24px;
      flex-shrink: 0;
    }
    .nav-item {
      width: 100%;
      padding-block: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 12px;
    }
    .nav-item svg { width: 24px; height: 24px; }
    .nav-item:hover, .nav-item.active { color: var(--fg); background: var(--fg-soft); }
    .nav-item.active { border-right: 2px solid var(--accent); color: var(--accent); }

    /* Main Container */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* TopBar */
    .topbar {
      height: var(--topbar-h);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-inline: 40px;
      gap: 20px;
      background: color-mix(in oklch, var(--bg) 80%, transparent);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    /* Workspace Content */
    .workspace {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* Parameter Panel */
    .panel {
      width: var(--panel-w);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      overflow-y: auto;
    }
    .panel-section { padding: 24px; border-bottom: 1px solid var(--border); }
    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .panel-header h2 { font-family: var(--font-display); font-size: 24px; margin: 0; }

    .tabs { display: flex; background: var(--bg); padding: 4px; border-radius: 8px; margin-bottom: 24px; }
    .tab { flex: 1; text-align: center; padding: 8px; font-size: 14px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .tab.active { background: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .field label { font-size: 13px; color: var(--muted); font-weight: 600; }
    .input-area { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--fg); font: inherit; resize: none; min-height: 120px; }
    .select-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .select-item { background: var(--bg); border: 1px solid var(--border); padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; font-size: 14px; }
    .select-item.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

    .create-btn { margin: 24px; padding: 16px; background: var(--accent); color: var(--bg); border-radius: 12px; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
    .create-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Canvas Area */
    .canvas {
      flex: 1;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }
    .canvas-placeholder { text-align: center; color: var(--muted); }
    .canvas-placeholder img { width: 300px; opacity: 0.2; margin-bottom: 24px; filter: grayscale(1); }

    .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; width: 100%; height: 100%; display: none; }
    .result-card { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--surface); position: relative; }
    .result-card img { width: 100%; height: 100%; object-fit: cover; }
    
    .floating-feedback { position: absolute; bottom: 32px; right: 32px; display: flex; gap: 12px; }
    .feedback-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 24px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 32px oklch(0% 0 0 / 0.4); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <a href="landing.html" class="logo" style="margin-bottom: 40px; color: var(--accent); text-decoration: none;">V</a>
    <a href="home.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
      首页
    </a>
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20M5 5l14 14M5 19L19 5"/></svg>
      生图
    </div>
    <a href="gallery.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
      资产
    </div>
    <a href="api-keys.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
      Claw
    </a>
    <div style="margin-top: auto;">
      <a href="profile.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        账户
      </a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="badge" style="padding: 6px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; font-size: 14px; font-family: var(--font-mono);">API 开放平台</div>
      <div class="badge" style="display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; font-size: 14px; font-family: var(--font-mono);">
        <svg class="credits-icon" style="color: var(--accent);" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
        免费积分
      </div>
      <div class="badge num" style="padding: 6px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; font-size: 14px; font-family: var(--font-mono);">
        <span class="credits-icon" style="color: var(--accent);">◈</span> 25.00000 | 首购优惠
      </div>
      <a href="profile.html" style="width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-weight: 700; text-decoration: none; color: inherit;">F</a>
    </header>

    <div class="workspace">
      <div class="panel">
        <div class="panel-section">
          <div class="tabs">
            <div class="tab">文生图片</div>
            <div class="tab active">参考生图</div>
          </div>
          <div class="panel-header">
            <h2>参考生图</h2>
          </div>
          <p style="font-size: 13px; color: var(--muted); margin-top: -8px;">参考多图元素，生成全新图片</p>
          
          <div style="display: flex; gap: 12px; margin-top: 24px;">
            <div style="flex: 1; aspect-ratio: 1.2; border: 2px dashed var(--border); border-radius: 12px; display: grid; place-items: center; color: var(--muted); font-size: 13px;">
              + 图片
            </div>
            <div style="flex: 1; aspect-ratio: 1.2; border: 2px dashed var(--border); border-radius: 12px; display: grid; place-items: center; color: var(--muted); font-size: 13px;">
              + 主体
            </div>
          </div>

          <div class="field" style="margin-top: 32px;">
            <label>提示词 (PROMPT)</label>
            <textarea class="input-area" placeholder="描述想要生成的内容..."></textarea>
          </div>
        </div>

        <div class="panel-section">
          <div class="field">
            <label>模型选择</label>
            <div class="select-item active" style="display: flex; justify-content: space-between; align-items: center;">
              <span>全能 Image</span>
              <span class="num">PRO</span>
            </div>
          </div>
          
          <div class="field">
            <label>清晰度 (QUALITY)</label>
            <div class="select-grid">
              <div class="select-item">1080p</div>
              <div class="select-item active">4K High</div>
            </div>
          </div>

          <div class="field">
            <label>比例 (ASPECT RATIO)</label>
            <div class="select-grid" style="grid-template-columns: repeat(3, 1fr);">
              <div class="select-item active">1:1</div>
              <div class="select-item">16:9</div>
              <div class="select-item">9:16</div>
            </div>
          </div>
        </div>

        <div class="panel-section" style="border-bottom: none; margin-top: auto;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; color: var(--muted);">
            <span>预估消耗</span>
            <span class="num" style="color: var(--accent);">5.12500 ◈</span>
          </div>
          <button class="create-btn" id="generate-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            开始创作
          </button>
        </div>
      </div>

      <div class="canvas">
        <div class="canvas-placeholder" id="placeholder">
          <img src="https://img.icons8.com/ios/452/image-gallery.png" alt="Empty">
          <h3 style="font-family: var(--font-display); font-size: 28px; margin-bottom: 8px;">开始创作您的第一个作品吧！</h3>
          <p>在左侧面板设置参数并点击“开始创作”</p>
        </div>

        <div class="results-grid" id="results">
           <div class="result-card">
              <img src="mpdhezm8-image.png" alt="Generated">
           </div>
        </div>

        <div class="floating-feedback">
          <div class="feedback-btn" style="color: var(--accent);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
            奖励合计 80 积分
          </div>
          <div class="feedback-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('generate-btn').addEventListener('click', () => {
      const btn = document.getElementById('generate-btn');
      const placeholder = document.getElementById('placeholder');
      const results = document.getElementById('results');
      
      btn.innerHTML = '生成中...';
      btn.style.opacity = '0.7';
      
      setTimeout(() => {
        placeholder.style.display = 'none';
        results.style.display = 'grid';
        btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14M12 5l7 7-7 7"/></svg> 开始创作';
        btn.style.opacity = '1';
      }, 1500);
    });
  </script>
</body>
</html>
