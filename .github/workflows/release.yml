name: Tagged Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test deployctl
        run: go test ./internal/deployctl -count=1
      - name: Test install fallback
        run: ./scripts/test/install-wrapper-contract.sh
      - name: Verify release contract
        run: ./scripts/devops/release-contract-test.sh

  build-deployctl:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Package deployctl
        env:
          RELEASE_GOOS: ${{ matrix.os }}
          RELEASE_GOARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TARGET_ROOT: target/release/deployctl-${{ matrix.os }}-${{ matrix.arch }}
        run: scripts/devops/package-deployctl.sh
      - name: Require deployctl checksum
        run: test "$(find target/release/deployctl-${{ matrix.os }}-${{ matrix.arch }} -name '*.sha256' -type f | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: deployctl-${{ matrix.os }}-${{ matrix.arch }}
          path: target/release/deployctl-${{ matrix.os }}-${{ matrix.arch }}/*
          if-no-files-found: error

  build-native:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/user/package-lock.json
            web/admin/package-lock.json
            web/docs/package-lock.json
      - name: Install frontend dependencies
        run: |
          npm --prefix web/user ci
          npm --prefix web/admin ci
          npm --prefix web/docs ci
      - name: Package native application
        env:
          DEVOPS_GOOS: ${{ matrix.os }}
          DEVOPS_GOARCH: ${{ matrix.arch }}
          DEVOPS_CGO_ENABLED: '0'
          DEVOPS_TARGET_ROOT: target/release/native-${{ matrix.os }}-${{ matrix.arch }}
        run: scripts/devops/package.sh native
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: target/release/native-${{ matrix.os }}-${{ matrix.arch }}/pic-gallery-native-${{ matrix.os }}-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-deployctl, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: target/release
          merge-multiple: true
      - name: Create release and upload only missing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          while IFS= read -r asset; do
            name="$(basename "$asset")"
            if printf '%s\n' "$existing_assets" | grep -Fxq "$name"; then
              echo "Skipping existing release asset: $name"
              continue
            fi
            gh release upload "$RELEASE_TAG" "$asset"
          done < <(find target/release -type f -print | sort)
