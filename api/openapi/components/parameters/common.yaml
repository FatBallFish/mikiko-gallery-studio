components:
  headers:
    XRequestId:
      description: Request identifier for tracing and support.
      schema:
        type: string
  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Optional idempotency key for safe task create retries.
    TabKey:
      name: tab_key
      in: path
      required: true
      schema:
        type: string
    AbstractModel:
      name: abstract_model
      in: query
      required: true
      schema:
        type: string
        enum: [basic, plus, pro]
    RequestedQuality:
      name: requested_quality
      in: query
      required: true
      schema:
        type: string
        enum: [auto, 1k, 2k, 4k]
    RequestedSize:
      name: requested_size
      in: query
      required: false
      schema:
        type: string
        examples: [auto, 1024x1024, 1536x1024]
    OutputImageCount:
      name: requested_output_image_count
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 5
    ReferenceImageCount:
      name: reference_image_count
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 4
    TaskType:
      name: task_type
      in: query
      required: true
      schema:
        type: string
        enum: [text_to_image, image_edit, reference_generate]
