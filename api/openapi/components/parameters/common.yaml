components:
  headers:
    XRequestId:
      description: Request identifier for tracing and support.
      schema:
        type: string
  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Optional idempotency key for safe task create retries.
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Required idempotency key for safe write retries.
    TabKey:
      name: tab_key
      in: path
      required: true
      schema:
        type: string
    RouteModelCode:
      name: route_model_code
      in: query
      required: true
      description: Current database-backed route model code. When both model fields are sent, this field takes precedence.
      schema:
        type: string
        minLength: 1
        example: basic
    AbstractModel:
      name: abstract_model
      in: query
      required: false
      deprecated: true
      description: Legacy static model selector retained for older clients. New clients must use route_model_code.
      schema:
        type: string
        enum: [basic, plus, pro]
    SizeMode:
      name: size_mode
      in: query
      required: false
      description: Size interpretation mode. Use ratio with aspect_ratio, or pixel with requested_size.
      schema:
        type: string
        enum: [ratio, pixel]
    AspectRatio:
      name: aspect_ratio
      in: query
      required: false
      description: Requested output aspect ratio when size_mode is ratio.
      schema:
        type: string
        examples: ['1:1', '16:9', '9:16']
    BaseResolution:
      name: base_resolution
      in: query
      required: true
      schema:
        type: string
        enum: [auto, 1k, 2k, 4k]
    Quality:
      name: quality
      in: query
      required: false
      schema:
        type: string
        enum: [auto, low, medium, high]
    OutputFormat:
      name: output_format
      in: query
      required: false
      schema:
        type: string
        enum: [png, jpeg, webp]
    OutputCompression:
      name: output_compression
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 100
    Moderation:
      name: moderation
      in: query
      required: false
      schema:
        type: string
        enum: [auto, low]
    RequestedSize:
      name: requested_size
      in: query
      required: false
      schema:
        type: string
        examples: [auto, 1024x1024, 1536x1024]
    OutputImageCount:
      name: requested_output_image_count
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 5
    ReferenceImageCount:
      name: reference_image_count
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 4
    TaskType:
      name: task_type
      in: query
      required: true
      schema:
        type: string
        enum: [text_to_image, image_edit, reference_generate]
