components:
  schemas:
    SuccessEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          properties:
            request_id:
              type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          type: object
          properties:
            request_id:
              type: string
    Pagination:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    ReferenceAsset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        mime_type:
          type: string
        file_size_bytes:
          type: integer
        width:
          type: integer
        height:
          type: integer
    ImageResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: Frontend-usable image URL. For local generated images this may be the authenticated download endpoint.
        download_url:
          type: string
          description: Authenticated local download URL. Present for locally stored generated images.
        b64_json:
          type: string
        mime_type:
          type: string
        file_size_bytes:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        sha256:
          type: string
        object_key:
          type: string
        storage_driver:
          type: string
        visibility_status:
          type: string
    ImageTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_type:
          type: string
        status:
          type: string
        abstract_model:
          type: string
        requested_quality:
          type: string
        resolved_quality_bucket:
          type: string
        requested_output_image_count:
          type: integer
        reference_image_count:
          type: integer
        estimated_points:
          type: string
          description: Decimal string with up to 5 fraction digits.
        actual_points:
          type: string
          description: Decimal string with up to 5 fraction digits.
        results:
          type: array
          items:
            $ref: '#/components/schemas/ImageResult'
