components:
  schemas:
    AdminPermission:
      type: string
      description: >-
        Admin permission facade value. Current production resolver maps the
        built-in super_admin/admin roles to this list; future custom RBAC can
        return the same permission values per admin session.
      enum:
        - read:all
        - manage:admins
        - manage:users
        - manage:billing
        - manage:cashier
        - manage:models
        - manage:reviews
        - manage:config
        - manage:dangerous_config
        - view:audit
    AdminRole:
      type: string
      description: Built-in admin roles. Unknown role strings are reserved for future custom RBAC and require explicit permissions in the session payload.
      enum:
        - super_admin
        - admin
    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AdminSession:
      type: object
      required: [access_token, expires_in_seconds, admin_id, email, role, permissions]
      properties:
        access_token:
          type: string
          description: Short-lived admin JWT access token.
        expires_in_seconds:
          type: integer
          minimum: 0
        admin_id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/AdminRole'
        permissions:
          type: array
          description: Resolved permissions for the current admin session. The frontend must prefer this list over role string inference when present.
          items:
            $ref: '#/components/schemas/AdminPermission'
    AdminLoginResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AdminSession'
        meta:
          type: object
          properties:
            request_id:
              type: string
    ConfigItem:
      type: object
      properties:
        config_category:
          type: string
        config_key:
          type: string
        config_value:
          type: object
          additionalProperties: true
        scope:
          type: string
        version:
          type: integer
    ConfigTab:
      type: object
      properties:
        tab_key:
          type: string
        tab_name:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConfigItem'
    ConfigTabListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ConfigTab'
    UpdateConfigTabRequest:
      type: object
      required: [version, items]
      properties:
        version:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConfigItem'
    ConfigTabResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ConfigTab'
    SecretStatus:
      type: object
      description: Write-only secret metadata. Plaintext secret values are never returned by read APIs.
      properties:
        has_secret:
          type: boolean
        fingerprint:
          type: string
          description: Short secret fingerprint for audit and operator confirmation.
        updated_at:
          type: string
          format: date-time
        secret_fields:
          type: array
          items:
            type: string
    AdminSecuritySMTPConfig:
      type: object
      required: [enabled, host, port, username, from, starttls, insecure_skip_verify, secret_status, version]
      properties:
        enabled:
          type: boolean
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
        from:
          type: string
        starttls:
          type: boolean
        insecure_skip_verify:
          type: boolean
        secret_status:
          $ref: '#/components/schemas/SecretStatus'
        version:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time
    AdminSecuritySMTPConfigWriteRequest:
      type: object
      required: [enabled, host, port, username, from, starttls, insecure_skip_verify]
      properties:
        version:
          type: integer
          format: int64
          description: Optimistic concurrency version. Omit or send 0 when creating the first config.
        enabled:
          type: boolean
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
        from:
          type: string
        starttls:
          type: boolean
        insecure_skip_verify:
          type: boolean
        secrets:
          type: object
          description: Optional write-only SMTP secrets. Omit to preserve existing secrets.
          properties:
            password:
              type: string
              format: password
        clear_secrets:
          type: array
          description: Secret field names to clear, for example ["password"].
          items:
            type: string
            enum: [password]
    AdminSecuritySMTPConfigResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AdminSecuritySMTPConfig'
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminSecuritySMTPTestRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        scene:
          type: string
          default: smtp_test
    AdminSecuritySMTPTestResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              enum: [sent]
            recipient:
              type: string
              format: email
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminStorageProbe:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [never, success, failed]
        checked_at:
          type: string
          format: date-time
          nullable: true
        latency_ms:
          type: integer
          format: int64
        message:
          type: string
    AdminStorageConfig:
      type: object
      required:
        - id
        - code
        - name
        - driver
        - provider
        - status
        - read_enabled
        - write_enabled
        - is_default
        - force_path_style
        - secret_status
        - last_probe
        - version
      properties:
        id:
          type: string
          description: Stable storage configuration ID persisted on generated images and reference assets.
        code:
          type: string
          description: Unique operator-facing code such as bootstrap-s3 or r2-prod.
        name:
          type: string
        driver:
          type: string
          enum: [local, s3]
        provider:
          type: string
          enum: [local, aws_s3, minio, r2, custom_s3]
          description: Cloudflare R2 uses driver=s3 and provider=r2.
        status:
          type: string
          enum: [enabled, disabled, deleted]
        read_enabled:
          type: boolean
          description: Whether historical objects may still be read through this configuration.
        write_enabled:
          type: boolean
          description: Whether new generated images and reference assets may be written here.
        is_default:
          type: boolean
          description: True for the current default writer.
        endpoint:
          type: string
        region:
          type: string
          description: R2 should use auto.
        bucket:
          type: string
        prefix:
          type: string
        force_path_style:
          type: boolean
        public_base_url:
          type: string
        local_root:
          type: string
        secret_status:
          $ref: '#/components/schemas/SecretStatus'
        last_probe:
          $ref: '#/components/schemas/AdminStorageProbe'
        version:
          type: integer
          format: int64
        updated_by:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminStorageConfigWriteRequest:
      type: object
      required: [name, driver, provider]
      properties:
        version:
          type: integer
          format: int64
          description: Optimistic concurrency version. Omit or send 0 when creating.
        code:
          type: string
          description: Required on create and immutable afterwards.
        name:
          type: string
        driver:
          type: string
          enum: [local, s3]
        provider:
          type: string
          enum: [local, aws_s3, minio, r2, custom_s3]
        status:
          type: string
          enum: [enabled, disabled]
          default: enabled
        read_enabled:
          type: boolean
          default: true
        write_enabled:
          type: boolean
          default: true
        endpoint:
          type: string
          description: S3-compatible endpoint, for example https://<ACCOUNT_ID>.r2.cloudflarestorage.com.
        region:
          type: string
          description: Use auto for Cloudflare R2.
        bucket:
          type: string
        prefix:
          type: string
        force_path_style:
          type: boolean
          default: false
        public_base_url:
          type: string
          description: Reserved for future direct delivery; current downloads remain proxied by the API.
        local_root:
          type: string
        secrets:
          type: object
          description: Optional write-only storage secrets. Omit fields to preserve existing secrets; masked placeholders are rejected.
          properties:
            access_key_id:
              type: string
              format: password
            secret_access_key:
              type: string
              format: password
        clear_secrets:
          type: array
          items:
            type: string
            enum: [access_key_id, secret_access_key]
    AdminStorageSetDefaultRequest:
      type: object
      properties:
        version:
          type: integer
          format: int64
    AdminStorageStatusRequest:
      type: object
      required: [status, read_enabled, write_enabled]
      properties:
        version:
          type: integer
          format: int64
        status:
          type: string
          enum: [enabled, disabled]
        read_enabled:
          type: boolean
        write_enabled:
          type: boolean
    AdminStorageConfigResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AdminStorageConfig'
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminStorageConfigListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminStorageConfig'
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminStorageProbeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AdminStorageProbe'
        meta:
          type: object
          properties:
            request_id:
              type: string
    SystemAdminUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          enum: [super_admin, admin]
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SystemAdminUserListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SystemAdminUser'
            pagination:
              $ref: ./common.yaml#/components/schemas/Pagination
        meta:
          type: object
          properties:
            request_id:
              type: string
    SystemAdminUserCreateRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [super_admin, admin]
        status:
          type: string
          enum: [active, disabled]
          default: active
    SystemAdminUserUpdateRequest:
      type: object
      properties:
        role:
          type: string
          enum: [super_admin, admin]
        status:
          type: string
          enum: [active, disabled]
    SystemAdminPasswordResetRequest:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
          minLength: 6
    SystemAdminUserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SystemAdminUser'
        meta:
          type: object
          properties:
            request_id:
              type: string
    SystemAdminPasswordResetResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              enum: [password_reset]
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminUserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        nickname:
          type: string
        status:
          type: string
          enum: [pending, active, disabled]
        user_group_code:
          type: string
        token_version:
          type: integer
        rpm_limit:
          type: integer
        concurrency_limit:
          type: integer
        default_locale:
          type: string
        theme:
          type: string
        closed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminUserListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminUserSummary'
            pagination:
              $ref: ./common.yaml#/components/schemas/Pagination
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminUserDetailResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/AdminUserSummary'
            balance:
              $ref: ./agent.yaml#/components/schemas/BalanceSummary
            recent_ledger:
              type: array
              items:
                $ref: ./agent.yaml#/components/schemas/PointLedgerEntry
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminCreateUserRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        nickname:
          type: string
        status:
          type: string
          enum: [pending, active, disabled]
          default: active
        user_group_code:
          type: string
          default: basic
        password:
          type: string
          description: Optional initial password. If omitted, the user can still log in through email code.
        rpm_limit:
          type: integer
          minimum: 0
          default: 0
        concurrency_limit:
          type: integer
          minimum: 0
          default: 0
        default_locale:
          type: string
          default: zh-CN
        theme:
          type: string
          default: system
    AdminCreateUserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AdminUserSummary'
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminUpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, disabled]
    AdminUserStatusResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AdminUserSummary'
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminPointAdjustmentRequest:
      type: object
      required: [change_points, reason]
      properties:
        change_points:
          type: string
          pattern: '^-?[0-9]+(\.[0-9]{1,5})?$'
        reason:
          type: string
          minLength: 1
          maxLength: 255
    AdminPointAdjustmentResponse:
      type: object
      properties:
        data:
          $ref: ./agent.yaml#/components/schemas/BalanceSummary
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminUserLimitsRequest:
      type: object
      required: [rpm_limit, concurrency_limit]
      properties:
        rpm_limit:
          type: integer
        concurrency_limit:
          type: integer
    AdminUserGroupAssignmentRequest:
      type: object
      required: [user_group_code]
      properties:
        user_group_code:
          type: string
    AdminResetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
    AdminUserGroup:
      type: object
      properties:
        group_code:
          type: string
        group_name:
          type: string
        multiplier:
          type: string
        status:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminUserGroupWriteRequest:
      type: object
      required: [group_code, group_name, multiplier, status]
      properties:
        group_code:
          type: string
        group_name:
          type: string
        multiplier:
          type: string
        status:
          type: string
        description:
          type: string
    AdminUserGroupResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AdminUserGroup'
    AdminUserGroupListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminUserGroup'
            pagination:
              $ref: ./common.yaml#/components/schemas/Pagination
    AdminRedeemCode:
      type: object
      properties:
        id:
          type: integer
          format: int64
        batch_id:
          type: integer
          format: int64
        code:
          type: string
        status:
          type: string
          enum: [inactive, available, redeemed, expired, disabled]
        reward_type:
          type: string
          enum: [points]
        reward_value:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,5})?$'
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        max_redemptions:
          type: integer
          minimum: 1
        redeemed_count:
          type: integer
          minimum: 0
        last_redeemed_by:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminCreateRedeemCodeRequest:
      type: object
      required: [reward_value, valid_until]
      properties:
        code:
          type: string
          description: Optional manual code. Empty value lets backend generate an uppercase safe code.
        batch_id:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum: [inactive, available, redeemed, expired, disabled]
        reward_type:
          type: string
          enum: [points]
        reward_value:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,5})?$'
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        max_redemptions:
          type: integer
          minimum: 1
    AdminBatchCreateRedeemCodesRequest:
      allOf:
        - $ref: '#/components/schemas/AdminCreateRedeemCodeRequest'
        - type: object
          required: [count, reward_value, valid_until]
          properties:
            count:
              type: integer
              minimum: 1
              maximum: 100
    AdminUpdateRedeemCodeStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [inactive, available, redeemed, expired, disabled]
    AdminRedeemCodeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AdminRedeemCode'
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminRedeemCodeListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminRedeemCode'
            pagination:
              $ref: ./common.yaml#/components/schemas/Pagination
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminBatchCreateRedeemCodesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminRedeemCode'
            count:
              type: integer
            batch_id:
              type: integer
              format: int64
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminExportRedeemCodesRequest:
      type: object
      properties:
        status:
          type: string
          enum: [inactive, available, redeemed, expired, disabled]
        code:
          type: string
          description: Optional fuzzy code filter.
        batch_id:
          type: integer
          format: int64
          minimum: 0
    AdminExportRedeemCodesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminRedeemCode'
            count:
              type: integer
            filters:
              type: object
              properties:
                status:
                  type: string
                code:
                  type: string
                batch_id:
                  type: integer
                  format: int64
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminRedeemCodeRedemptionEntry:
      allOf:
        - $ref: ./agent.yaml#/components/schemas/PointLedgerEntry
        - type: object
          properties:
            user_id:
              type: integer
              format: int64
            redeem_code_id:
              type: integer
              format: int64
    AdminRedeemCodeRedemptionsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminRedeemCodeRedemptionEntry'
            pagination:
              $ref: ./common.yaml#/components/schemas/Pagination
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminCallRecord:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
        user_id:
          type: integer
          format: int64
        api_key_id:
          type: integer
          format: int64
          nullable: true
        source_channel:
          type: string
        task_type:
          type: string
        status:
          type: string
        provider:
          type: string
        abstract_model:
          type: string
        quality:
          type: string
        requested_output_image_count:
          type: integer
        success_output_image_count:
          type: integer
        reference_image_count:
          type: integer
        estimated_points:
          type: string
        actual_points:
          type: string
        provider_model_id:
          type: integer
          format: int64
          nullable: true
        account_model_id:
          type: integer
          format: int64
          nullable: true
        model_account_id:
          type: integer
          format: int64
          nullable: true
        upstream_model_code:
          type: string
        provider_cost:
          type: string
        gross_margin:
          type: string
        fallback_count:
          type: integer
        route_snapshot_version:
          type: integer
          format: int64
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        error_detail:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        attempt_count:
          type: integer
          minimum: 0
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/AdminCallRecordAttempt'
    AdminCallRecordAttempt:
      type: object
      properties:
        provider:
          type: string
        adapter_type:
          type: string
        account_model_id:
          type: integer
          format: int64
          nullable: true
        model_account_id:
          type: integer
          format: int64
          nullable: true
        model_code:
          type: string
        status:
          type: string
        error:
          type: string
        error_code:
          type: string
        error_message:
          type: string
        error_detail:
          type: object
          additionalProperties: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    AdminCallRecordListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminCallRecord'
            pagination:
              $ref: ./common.yaml#/components/schemas/Pagination
        meta:
          type: object
          properties:
            request_id:
              type: string
    AdminModelProvider:
      type: object
      properties:
        id:
          type: integer
          format: int64
        provider_code:
          type: string
        provider_type:
          type: string
        auth_config_encrypted:
