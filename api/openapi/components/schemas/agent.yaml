components:
  schemas:
    SendEmailCodeRequest:
      type: object
      required: [email, scene]
      properties:
        email:
          type: string
          format: email
        scene:
          type: string
          enum: [login, register, forgot_password]
    EmailCodeLoginRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
        redirect_to:
          type: string
    SessionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string
            expires_in_seconds:
              type: integer
            user_id:
              type: integer
    PasswordLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    PasswordChangeRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
        new_password:
          type: string
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetConfirmRequest:
      type: object
      required: [email, code, new_password]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
        new_password:
          type: string
    StatusMessageResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        nickname:
          type: string
        bio:
          type: string
        avatar_object_key:
          type: string
        user_group_code:
          type: string
        theme:
          type: string
        default_locale:
          type: string
    UserProfileResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UserProfile'
    UpdateUserProfileRequest:
      type: object
      properties:
        nickname:
          type: string
        bio:
          type: string
        avatar_object_key:
          type: string
        default_locale:
          type: string
        theme:
          type: string
    BalanceSummary:
      type: object
      properties:
        available_points:
          type: string
          pattern: '^\d+\.\d{5}$'
        frozen_points:
          type: string
          pattern: '^\d+\.\d{5}$'
        subscription_points:
          type: string
          pattern: '^\d+\.\d{5}$'
        gift_points:
          type: string
          pattern: '^\d+\.\d{5}$'
        recharge_points:
          type: string
          pattern: '^\d+\.\d{5}$'
        user_group_multiplier:
          type: string
          pattern: '^\d+\.\d{5}$'
        cny_per_point:
          type: string
          pattern: '^\d+\.\d{5}$'
        active_subscription:
          $ref: '#/components/schemas/UserSubscription'
        next_expiring_grant:
          $ref: '#/components/schemas/GrantExpirySummary'
    BalanceResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BalanceSummary'
        meta:
          type: object
          properties:
            request_id:
              type: string
    PointLedgerEntry:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: string
        ledger_type:
          type: string
        change_points:
          type: string
          pattern: '^-?\d+\.\d{5}$'
        balance_after:
          type: string
          pattern: '^\d+\.\d{5}$'
        frozen_after:
          type: string
          pattern: '^\d+\.\d{5}$'
        reason:
          type: string
        created_at:
          type: string
          format: date-time
    PointLedgerPageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PointLedgerEntry'
            pagination:
              $ref: ./common.yaml#/components/schemas/Pagination
        meta:
          type: object
          properties:
            request_id:
              type: string
    EstimateResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            resolved_quality_bucket:
              type: string
            estimated_points:
              type: string
            user_group_multiplier:
              type: string
            requested_output_image_count:
              type: integer
            reference_image_count:
              type: integer
    GrantExpirySummary:
      type: object
      properties:
        grant_id:
          type: integer
          format: int64
        source_type:
          type: string
        remaining_points:
          type: string
        expires_at:
          type: string
          format: date-time
    SubscriptionPlan:
      type: object
      properties:
        id:
          type: integer
          format: int64
        plan_code:
          type: string
        plan_name:
          type: string
        points_grant:
          type: string
        price_cny:
          type: string
        duration_days:
          type: integer
        active:
          type: boolean
    SubscriptionPlanListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SubscriptionPlan'
    UserSubscription:
      type: object
      properties:
        id:
          type: integer
          format: int64
        plan_code:
          type: string
        plan_name:
          type: string
        status:
          type: string
        started_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        auto_renew:
          type: boolean
    UserSubscriptionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            item:
              $ref: '#/components/schemas/UserSubscription'
    PaymentOrder:
      type: object
      properties:
        id:
          type: integer
          format: int64
        order_no:
          type: string
        plan_code:
          type: string
        provider:
          type: string
        amount_cny:
          type: string
        points_grant:
          type: string
        status:
          type: string
        channel_trade_no:
          type: string
        paid_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaymentOrderCreateRequest:
      type: object
      required: [plan_code, provider]
      properties:
        plan_code:
          type: string
        provider:
          type: string
          enum: [alipay, wxpay]
    PaymentOrderResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PaymentOrder'
    PaymentOrderListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PaymentOrder'
            pagination:
              $ref: ./common.yaml#/components/schemas/Pagination
    CapabilityItem:
      type: object
      properties:
        abstract_model:
          type: string
        task_types:
          type: array
          items:
            type: string
        qualities:
          type: array
          items:
            type: string
        max_output_image_count:
          type: integer
        max_reference_image_count:
          type: integer
    CapabilitiesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CapabilityItem'
    ReferenceAssetUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    ReferenceAssetResponse:
      type: object
      properties:
        data:
          $ref: ./common.yaml#/components/schemas/ReferenceAsset
    CreateImageTaskRequest:
      type: object
      required: [task_type, prompt, abstract_model, requested_quality, requested_output_image_count]
      properties:
        task_type:
          type: string
          enum: [text_to_image, image_edit, reference_generate]
        prompt:
          type: string
        negative_prompt:
          type: string
        abstract_model:
          type: string
          enum: [basic, plus, pro]
        requested_quality:
          type: string
          enum: [auto, 1k, 2k, 4k]
        requested_size:
          type: string
        aspect_ratio:
          type: string
        requested_output_image_count:
          type: integer
          minimum: 1
          maximum: 5
        reference_image_count:
          type: integer
          minimum: 0
          maximum: 4
        reference_asset_ids:
          type: array
          items:
            type: string
            format: uuid
        mask_asset_id:
          type: string
          format: uuid
        response_mode:
          type: string
          enum: [async]
          description: Native Agent/Open API task creation is async-only; omit the field or send async, then poll task detail.
    ImageTaskResponse:
      type: object
      properties:
        data:
          $ref: ./common.yaml#/components/schemas/ImageTask
