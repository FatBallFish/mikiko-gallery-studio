      operationId: getAgentImageAccess
      security:
        - bearerAuth: []
      parameters:
        - name: image_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: purpose
          in: query
          required: true
          schema: { type: string, enum: [ preview, download ] }
      responses:
        '200':
          description: Short-lived permission-checked media URL
          content:
            application/json:
              schema:
                type: object
                required: [ data ]
                properties:
                  data:
                    type: object
                    required: [ url ]
                    properties:
                      url: { type: string, format: uri-reference }
                      expires_at: { type: string, format: date-time }
        '404':
          description: Image not found or not owned by caller
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
  /api/agent/image/v1/history/tasks:
    get:
      tags: [ Agent Image ]
