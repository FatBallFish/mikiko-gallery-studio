openapi: 3.1.0
info:
  title: Pic Gallery API
  version: 0.2.0
  description: >-
    P0 baseline contract for Pic Gallery, including Agent API, Open API,
    OpenAI-compatible image APIs, and admin configuration endpoints.
servers:
  - url: http://localhost:8080
    description: Local API server
tags:
  - name: Health
  - name: Agent Auth
  - name: Agent User
  - name: Agent Billing
  - name: Agent Image
  - name: Open Image API
  - name: Admin Config
  - name: Admin Users
  - name: Admin Redeem Codes
  - name: Admin Call Records
  - name: Admin Model Routing
  - name: OpenAI Compat
paths:
  /:
    get:
      tags: [Health]
      summary: Service bootstrap status
      operationId: getRoot
      responses:
        '200':
          description: Service is running
          headers:
            X-Request-Id:
              $ref: ./components/parameters/common.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealthz
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
  /readyz:
    get:
      tags: [Health]
      summary: Readiness check
      operationId: getReadyz
      responses:
        '200':
          description: API is ready
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics endpoint
      operationId: getMetrics
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string
  /api/agent/auth/v1/email/send-code:
    post:
      tags: [Agent Auth]
      summary: Send email verification code
      operationId: postAgentAuthSendCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/SendEmailCodeRequest
      responses:
        '202':
          description: Verification code accepted for delivery
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/agent/auth/v1/login/email-code:
    post:
      tags: [Agent Auth]
      summary: Login or register with email code
      operationId: postAgentAuthEmailLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/EmailCodeLoginRequest
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/SessionResponse
  /api/agent/auth/v1/session/refresh:
    post:
      tags: [Agent Auth]
      summary: Refresh user session
      operationId: postAgentAuthRefresh
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/SessionResponse
  /api/agent/user/v1/profile:
    get:
      tags: [Agent User]
      summary: Get current user profile
      operationId: getAgentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/UserProfileResponse
    put:
      tags: [Agent User]
      summary: Update current user profile
      operationId: putAgentUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/UpdateUserProfileRequest
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/UserProfileResponse
  /api/agent/billing/v1/balance:
    get:
      tags: [Agent Billing]
      summary: Get points balance summary
      operationId: getAgentBalance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Balance summary
          headers:
            X-Request-Id:
              $ref: ./components/parameters/common.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/BalanceResponse
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/agent/billing/v1/ledger:
    get:
      tags: [Agent Billing]
      summary: Get points ledger entries
      operationId: getAgentLedger
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        '200':
          description: Ledger page
          headers:
            X-Request-Id:
              $ref: ./components/parameters/common.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/PointLedgerPageResponse
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/agent/billing/v1/estimate:
    get:
      tags: [Agent Billing]
      summary: Estimate generation points cost
      operationId: getAgentEstimate
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./components/parameters/common.yaml#/components/parameters/AbstractModel
        - $ref: ./components/parameters/common.yaml#/components/parameters/RequestedQuality
        - $ref: ./components/parameters/common.yaml#/components/parameters/RequestedSize
        - $ref: ./components/parameters/common.yaml#/components/parameters/OutputImageCount
        - $ref: ./components/parameters/common.yaml#/components/parameters/ReferenceImageCount
        - $ref: ./components/parameters/common.yaml#/components/parameters/TaskType
      responses:
        '200':
          description: Cost estimate
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/EstimateResponse
  /api/agent/image/v1/capabilities:
    get:
      tags: [Agent Image]
      summary: Get visible image generation capabilities
      operationId: getAgentImageCapabilities
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Capability matrix
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/CapabilitiesResponse
  /api/agent/image/v1/reference-assets:
    post:
      tags: [Agent Image]
      summary: Upload a reference asset through Agent API
      operationId: postAgentReferenceAsset
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/ReferenceAssetUploadRequest
      responses:
        '201':
          description: Reference asset created
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/ReferenceAssetResponse
  /api/agent/image/v1/tasks:
    get:
      tags: [Agent Image]
      summary: List image tasks for current user
      operationId: listAgentImageTasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ./components/schemas/common.yaml#/components/schemas/ImageTask
    post:
      tags: [Agent Image]
      summary: Create an image generation task
      operationId: postAgentImageTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/CreateImageTaskRequest
      responses:
        '202':
          description: Task accepted
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/ImageTaskResponse
        '400':
          description: Invalid task request, including unsupported sync response_mode
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/agent/image/v1/tasks/{task_id}:
    get:
      tags: [Agent Image]
      summary: Get image task detail
      operationId: getAgentImageTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./components/parameters/common.yaml#/components/parameters/TaskId
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/ImageTaskResponse
  /api/agent/image/v1/images/{image_id}:
    get:
      tags: [Agent Image]
      summary: Download a locally stored generated image
      operationId: getAgentImageDownload
      security:
        - bearerAuth: []
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
        '404':
          description: Image not found, not owned by caller, deleted, or not locally stored
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
  /api/agent/image/v1/history/tasks:
    get:
      tags: [Agent Image]
      summary: List history tasks for current user
      operationId: listAgentHistoryTasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: History task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ./components/schemas/common.yaml#/components/schemas/ImageTask
  /api/agent/image/v1/history/tasks/{task_id}:
    get:
      tags: [Agent Image]
      summary: Get history task detail
      operationId: getAgentHistoryTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./components/parameters/common.yaml#/components/parameters/TaskId
      responses:
        '200':
          description: History task detail
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/ImageTaskResponse
    delete:
      tags: [Agent Image]
      summary: Hide a history task from the current user
      operationId: deleteAgentHistoryTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./components/parameters/common.yaml#/components/parameters/TaskId
      responses:
        '204':
          description: History task hidden
  /api/open/image/v1/reference-assets/uploads:
    post:
      tags: [Open Image API]
      summary: Create an upload session for reference assets
      operationId: postOpenReferenceAssetUploadSession
      security:
        - accessKeyAuth: []
          accessTimestamp: []
          accessBodySHA256: []
          accessSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/openapi.yaml#/components/schemas/UploadSessionRequest
      responses:
        '201':
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: ./components/schemas/openapi.yaml#/components/schemas/UploadSessionResponse
  /api/open/image/v1/tasks:
    post:
      tags: [Open Image API]
      summary: Create an image task through Open API
      operationId: postOpenImageTask
      security:
        - accessKeyAuth: []
          accessTimestamp: []
          accessBodySHA256: []
          accessSignature: []
      parameters:
        - $ref: ./components/parameters/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/CreateImageTaskRequest
      responses:
        '202':
          description: Task accepted
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/ImageTaskResponse
        '400':
          description: Invalid task request, including unsupported sync response_mode
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/open/image/v1/estimate:
    get:
      tags: [Open Image API]
      summary: Estimate task points through Open API
      operationId: getOpenEstimate
      security:
        - accessKeyAuth: []
          accessTimestamp: []
          accessBodySHA256: []
          accessSignature: []
      parameters:
        - $ref: ./components/parameters/common.yaml#/components/parameters/AbstractModel
        - $ref: ./components/parameters/common.yaml#/components/parameters/RequestedQuality
        - $ref: ./components/parameters/common.yaml#/components/parameters/RequestedSize
        - $ref: ./components/parameters/common.yaml#/components/parameters/OutputImageCount
        - $ref: ./components/parameters/common.yaml#/components/parameters/ReferenceImageCount
        - $ref: ./components/parameters/common.yaml#/components/parameters/TaskType
      responses:
        '200':
          description: Cost estimate
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/EstimateResponse
  /api/ops/admin/v1/config-tabs:
    get:
      tags: [Admin Config]
      summary: List admin configuration tabs
      operationId: getAdminConfigTabs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Config tabs page data
          content:
            application/json:
              schema:
                $ref: ./components/schemas/admin.yaml#/components/schemas/ConfigTabListResponse
  /api/ops/admin/v1/config-tabs/{tab_key}:
    put:
      tags: [Admin Config]
      summary: Update a configuration tab
      operationId: putAdminConfigTab
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./components/parameters/common.yaml#/components/parameters/TabKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/admin.yaml#/components/schemas/UpdateConfigTabRequest
      responses:
        '200':
          description: Updated config tab
          content:
            application/json:
              schema:
                $ref: ./components/schemas/admin.yaml#/components/schemas/ConfigTabResponse
  /api/ops/admin/v1/users:
    get:
      tags: [Admin Users]
      summary: List users for admin operations
      operationId: getAdminUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive match against email or nickname.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, active, disabled]
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema:
                $ref: ./components/schemas/admin.yaml#/components/schemas/AdminUserListResponse
  /api/ops/admin/v1/users/{user_id}:
    get:
      tags: [Admin Users]
      summary: Get admin user detail
      operationId: getAdminUser
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User detail with balance and recent ledger
          content:
            application/json:
              schema:
                $ref: ./components/schemas/admin.yaml#/components/schemas/AdminUserDetailResponse
  /api/ops/admin/v1/users/{user_id}/status:
    post:
      tags: [Admin Users]
      summary: Enable or disable a user
      operationId: postAdminUserStatus
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/admin.yaml#/components/schemas/AdminUpdateUserStatusRequest
      responses:
        '200':
          description: Updated user. Status changes increment token_version.
          content:
            application/json:
              schema:
                $ref: ./components/schemas/admin.yaml#/components/schemas/AdminUserStatusResponse
  /api/ops/admin/v1/users/{user_id}/points-adjustments:
    post:
      tags: [Admin Users]
      summary: Adjust a user's points balance
      operationId: postAdminUserPointsAdjustment
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: ./components/parameters/common.yaml#/components/parameters/RequiredIdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/admin.yaml#/components/schemas/AdminPointAdjustmentRequest
      responses:
        '200':
          description: Updated balance. Replaying the same Idempotency-Key does not duplicate ledger entries.
          content:
            application/json:
              schema:
                $ref: ./components/schemas/admin.yaml#/components/schemas/AdminPointAdjustmentResponse
  /api/ops/admin/v1/redeem-codes:
    get:
      tags: [Admin Redeem Codes]
      summary: List redeem codes
      operationId: getAdminRedeemCodes
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema:
            type: string
            enum: [inactive, available, redeemed, expired, disabled]
        - name: code
          in: query
          schema: { type: string }
        - name: batch_id
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Redeem code page
          content:
            application/json:
              schema:
                $ref: ./components/schemas/admin.yaml#/components/schemas/AdminRedeemCodeListResponse
    post:
      tags: [Admin Redeem Codes]
      summary: Create one redeem code
      operationId: postAdminRedeemCode
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/admin.yaml#/components/schemas/AdminCreateRedeemCodeRequest
      responses:
        '201':
          description: Redeem code created
          content:
            application/json:
              schema:
                $ref: ./components/schemas/admin.yaml#/components/schemas/AdminRedeemCodeResponse
  /api/ops/admin/v1/redeem-codes:batch-create:
    post:
      tags: [Admin Redeem Codes]
      summary: Batch create redeem codes
      operationId: postAdminRedeemCodesBatchCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/admin.yaml#/components/schemas/AdminBatchCreateRedeemCodesRequest
      responses:
        '201':
          description: Redeem code batch created
          content:
            application/json:
              schema:
                $ref: ./components/schemas/admin.yaml#/components/schemas/AdminBatchCreateRedeemCodesResponse
  /api/ops/admin/v1/redeem-codes/{code_id}/status:
    post:
      tags: [Admin Redeem Codes]
      summary: Update redeem code status
      operationId: postAdminRedeemCodeStatus
      security:
        - bearerAuth: []
      parameters:
        - name: code_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/admin.yaml#/components/schemas/AdminUpdateRedeemCodeStatusRequest
      responses:
        '200':
          description: Redeem code updated
          content:
            application/json:
              schema:
                $ref: ./components/schemas/admin.yaml#/components/schemas/AdminRedeemCodeResponse
  /api/ops/admin/v1/redeem-codes/{code_id}/redemptions:
    get:
      tags: [Admin Redeem Codes]
      summary: List redemption ledger entries for one redeem code
      operationId: getAdminRedeemCodeRedemptions
      security:
        - bearerAuth: []
      parameters:
        - name: code_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Redemption ledger page
          content:
            application/json:
              schema:
                $ref: ./components/schemas/admin.yaml#/components/schemas/AdminRedeemCodeRedemptionsResponse
  /api/ops/admin/v1/call-records:
    get:
      tags: [Admin Call Records]
      summary: List image task call records
      operationId: getAdminCallRecords
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { type: string }
        - name: provider
          in: query
          schema: { type: string }
        - name: source_channel
          in: query
          schema: { type: string }
        - name: user_id
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: task_id
          in: query
          schema: { type: string, format: uuid }
        - name: created_from
          in: query
          schema: { type: string, format: date-time }
        - name: created_to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Image task call record page
          content:
            application/json:
              schema:
                $ref: ./components/schemas/admin.yaml#/components/schemas/AdminCallRecordListResponse
  /api/ops/admin/v1/model-providers:
    get:
      tags: [Admin Model Routing]
      summary: List model providers
      operationId: getAdminModelProviders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: provider_type
          in: query
          schema: { type: string }
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Model provider page
          content:
            application/json:
              schema:
                $ref: ./components/schemas/admin.yaml#/components/schemas/AdminModelProviderListResponse
    post:
      tags: [Admin Model Routing]
      summary: Create a model provider
      operationId: postAdminModelProvider
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/admin.yaml#/components/schemas/AdminModelProviderWriteRequest
      responses:
        '201':
          description: Model provider created
          content:
            application/json:
              schema:
                $ref: ./components/schemas/admin.yaml#/components/schemas/AdminModelProviderResponse
  /api/ops/admin/v1/model-providers/{provider_code}:
    get:
      tags: [Admin Model Routing]
      summary: Get a model provider
      operationId: getAdminModelProvider
      security:
        - bearerAuth: []
      parameters:
        - name: provider_code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
