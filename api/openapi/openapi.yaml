components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    compatBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk-*
    accessKeyAuth:
      type: apiKey
      in: header
      name: X-Access-Key
    accessTimestamp:
      type: apiKey
      in: header
      name: X-Timestamp
      description: RFC3339 timestamp; requests outside the configured drift window are rejected.
    accessBodySHA256:
      type: apiKey
      in: header
      name: X-Body-SHA256
      description: Base64url-encoded SHA-256 of the exact request body bytes; use the empty body hash for GET.
    accessSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC-SHA256 over method, request URI, timestamp, and X-Body-SHA256 using the API key secret.
