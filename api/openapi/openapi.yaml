components:
  parameters:
    AdminVideoResourceID: { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    AdminVideoExpectedVersion: { name: expected_version, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
    CanvasID: { name: canvas_id, in: path, required: true, schema: { type: string, format: uuid } }
    CanvasNodeID: { name: node_id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    CanvasRunID: { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    AdminVideoResponse:
      description: Video administration payload in the standard success envelope
      content: { application/json: { schema: { $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope } } }
    AdminVideoSafetyConflict:
      description: Blocked by stale CAS, missing candidate/capability/rate card, unsupported parameter mapping, or an unavailable fixed quote.
      content: { application/json: { schema: { $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope } } }
  schemas:
    MediaGroupsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: string
        meta:
          type: object
          properties:
            request_id:
              type: string
    PublicMediaVideoSummary:
      type: object
      required: [id, title, media_type, status, video_url, poster_url, created_at]
      description: Public feed video summary with no full prompt, owner identity, project or review metadata.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        media_type: { type: string, enum: [video] }
        status: { type: string, enum: [approved] }
        video_url: { type: string }
        poster_url: { type: string }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: integer, format: int64 }
        published_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    PublicMediaItem:
      oneOf:
        - type: object
          required: [media_type, id, image]
          properties:
            media_type: { type: string, enum: [image] }
            id: { type: string }
            image:
              $ref: ./components/schemas/common.yaml#/components/schemas/PublicGalleryListImage
        - type: object
          required: [media_type, id, video]
          properties:
            media_type: { type: string, enum: [video] }
            id: { type: string }
            video:
              $ref: '#/components/schemas/PublicMediaVideoSummary'
      discriminator:
        propertyName: media_type
    PublicMediaPageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PublicMediaItem'
            pagination:
              $ref: ./components/schemas/common.yaml#/components/schemas/Pagination
    VideoPublication:
      type: object
      required:
        - id
        - title
        - media_type
        - status
        - video_url
        - poster_url
        - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        media_type:
          type: string
          enum:
            - video
        status:
          type: string
          enum:
            - private
            - pending_review
            - approved
            - rejected
        prompt:
          type: string
        video_url:
          type: string
        poster_url:
          type: string
        width:
          type: integer
        height:
          type: integer
        duration_ms:
          type: integer
          format: int64
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    PublicVideo:
      allOf:
        - $ref: '#/components/schemas/VideoPublication'
        - type: object
          properties:
            status:
              type: string
              enum:
                - approved
            like_count:
              type: integer
              minimum: 0
            favorite_count:
              type: integer
              minimum: 0
            liked_by_viewer:
              type: boolean
            favorited_by_viewer:
              type: boolean
            download_url:
              type: string
              description: Relative authenticated download endpoint; never a storage object URL.
      description: Public projection excludes owner identity, project, review reason and internal execution metadata.
    VideoPublicationRecord:
      allOf:
        - $ref: '#/components/schemas/VideoPublication'
        - type: object
          properties:
            review_reason:
              type: string
    HistoryClearFailedRequest:
      type: object
      properties:
        project_id:
          type: string
          description: Optional project scope; omitted or empty string covers all owned projects.
      additionalProperties: false
    PublicVideoResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PublicVideo'
        meta:
          type: object
          properties:
            request_id:
              type: string
    VideoPublicationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/VideoPublicationRecord'
        meta:
          type: object
          properties:
            request_id:
              type: string
    PublicVideoPageResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - items
            - total
            - page
            - page_size
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PublicVideo'
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer
        meta:
          type: object
          properties:
            request_id:
              type: string
    VideoReviewPageResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - items
            - total
            - page
            - page_size
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VideoPublicationRecord'
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer
        meta:
          type: object
          properties:
            request_id:
              type: string
    HistoryClearFailedResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - hidden_count
          properties:
            hidden_count:
              type: integer
              minimum: 0
        meta:
          type: object
          properties:
            request_id:
              type: string
    ImageHistoryRetryResponse:
      $ref: ./components/schemas/agent.yaml#/components/schemas/ImageTaskResponse
    AgentFeatureFlags:
      type: object
      required: [ video_creation, creative_canvas, media_upload, oidc_login, password_login_enabled, registration_enabled ]
      properties:
        video_creation: { type: boolean }
        creative_canvas: { type: boolean }
        media_upload: { type: boolean }
        oidc_login:
          type: object
          required: [ enabled ]
          properties:
            enabled: { type: boolean }
            display_name: { type: string, description: Login button label, defaults to 使用 Mikiko ID 登录 when empty. }
        password_login_enabled: { type: boolean, description: Whether password and email-code login are open. }
        registration_enabled: { type: boolean, description: Whether local email-code sign-up may create new accounts. }
      additionalProperties: false
    AgentFeatureFlagsResponse:
      type: object
      required: [ data, meta ]
      properties:
        data:
          $ref: '#/components/schemas/AgentFeatureFlags'
        meta:
          type: object
          additionalProperties: true
      additionalProperties: false
    AdminVideoCapabilityWrite:
      type: object
      required: [ expected_version, capability_version, capability, validation_status, enabled ]
      properties:
        expected_version: { type: string }
        capability_version: { type: string, minLength: 1, maxLength: 128 }
        capability:
          type: object
          required: [ schema_version, provider_native_max_n, task_types ]
          properties:
            schema_version: { type: integer, const: 1 }
            provider_native_max_n: { type: integer, minimum: 1, maximum: 10, description: Provider-native n; platform output_count remains 1-4 and keeps existing split-task behavior. }
            task_types: { type: object, minProperties: 1, additionalProperties: { type: object } }
          additionalProperties: true
        validation_status: { type: string, enum: [ draft, verified, failed ] }
        enabled: { type: boolean }
      additionalProperties: false
    AdminVideoRateCardWrite:
      type: object
      required: [ expected_rate_version, pricing_schema, rate_config, enabled ]
      properties:
        expected_rate_version: { type: integer, minimum: 0 }
        pricing_schema: { type: string, enum: [ seedance_token_v1, minimax_h3_second_v1 ] }
        rate_config: { type: object, additionalProperties: true, description: Validated against the selected provider-native pricing schema. }
        enabled: { type: boolean }
      additionalProperties: false
    AdminVideoQuoteSimulationRequest:
      type: object
      required: [ task_type, resolution, aspect_ratio, audio_mode, duration_seconds, output_count ]
      properties:
        task_type: { type: string, enum: [ text_to_video, image_to_video, first_last_frame_to_video ] }
        resolution: { type: string }
        aspect_ratio: { type: string }
        audio_mode: { type: string, enum: [ silent, generated ] }
        duration_seconds: { type: integer, minimum: 1 }
        output_count: { type: integer, minimum: 1, maximum: 4 }
        inputs: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: false
    AdminVideoRouteConfigWrite:
      type: object
      required: [ expected_version, config_version, candidate_parameter_mappings, minimum_task_points, rounding_step_points, task_types, visible_combinations, max_output_count, enabled ]
      properties:
        expected_version: { type: string }
        config_version: { type: string }
        candidate_parameter_mappings: { type: object, additionalProperties: true }
        minimum_task_points: { type: string, pattern: '^\d+(\.\d{1,5})?$' }
        rounding_step_points: { type: integer, enum: [ 1, 5, 10 ] }
        task_types: { type: array, minItems: 1, items: { type: string } }
        visible_options: { type: object, additionalProperties: true }
        defaults: { type: object, additionalProperties: true }
        visible_combinations:
          type: array
          minItems: 1
          items:
            type: object
            required: [ task_type, resolution, audio_mode, duration_seconds ]
            properties:
              task_type: { type: string }
              resolution: { type: string }
              aspect_ratio: { type: string }
              audio_mode: { type: string }
              duration_seconds: { type: integer, minimum: 1 }
        max_output_count: { type: integer, minimum: 1, maximum: 4 }
        enabled: { type: boolean }
      additionalProperties: false
    CanvasNode:
      description: >-
        Schema 1 integrated image_v2/video_v2 nodes are empty generation nodes when asset_id is absent, or filled media when present. Empty nodes are valid alone. Only empty v2 nodes accept estimate/generate. Legacy prompt/image/video/ image_generation/video_generation nodes remain readable and deletable; mutations may only retain their IDs and content unchanged. Canvas duplication containing legacy nodes is rejected. Existing legacy runs remain recoverable.
      type: object
      required: [ id, type, position, size ]
      properties:
        id: { type: string, maxLength: 64 }
        type: { type: string, enum: [ image_v2, video_v2, prompt, image, video, audio, image_generation, video_generation, note ] }
        asset_id: { type: string, format: uuid }
        position: { type: object, required: [ x, y ], properties: { x: { type: number }, y: { type: number } } }
        size: { type: object, required: [ width, height ], properties: { width: { type: number }, height: { type: number } } }
        payload:
          type: object
          description: >-
            Integrated nodes use name as a stable reference alias, title as an editable display name, and draft for generation parameters. Incoming edges supply media; canonical prompt references bind by source payload.name, never title. URLs, provider secrets and embedded binary data must not be persisted.
          properties:
            name: { type: string, description: Stable input reference alias }
            title: { type: string, description: Editable display title }
            draft:
              type: object
              description: Existing image/video request fields; video quote_token is returned by estimate detail.quote_token and persisted here before generate. Media inputs and reference bindings are derived from edges.
              properties:
                prompt_template: { type: string, description: 'Canonical {{$variable}} and {{@alias}} tokens; ${variable} is also accepted.' }
                variables: { type: object, additionalProperties: { type: string } }
                quote_token: { type: string }
              additionalProperties: true
          additionalProperties: true
      additionalProperties: false
    CanvasEdge:
      type: object
      required: [ id, source, target, input_role ]
      properties:
        id: { type: string, maxLength: 64 }
        source: { type: string, maxLength: 64 }
        target: { type: string, maxLength: 64 }
        source_handle: { type: string }
        target_handle: { type: string }
        input_role: { type: string, enum: [ prompt, reference, first_frame, last_frame, reference_image, reference_video, reference_audio, result ] }
        ordinal: { type: integer, minimum: 0 }
      additionalProperties: false
    CanvasDocument:
      type: object
      required: [ schema_version, viewport, nodes, edges ]
      properties:
        schema_version: { type: integer, enum: [ 1 ] }
        viewport: { type: object, required: [ x, y, zoom ], properties: { x: { type: number }, y: { type: number }, zoom: { type: number } } }
        nodes: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/CanvasNode' } }
        edges: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/CanvasEdge' } }
      additionalProperties: false
    Canvas:
      type: object
      required: [ id, project_id, name, revision, metadata_version, document, node_count, edge_count, status ]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string, maxLength: 128 }
        revision: { type: integer, format: int64 }
        metadata_version: { type: integer, format: int64 }
        document: { $ref: '#/components/schemas/CanvasDocument' }
        node_count: { type: integer }
        edge_count: { type: integer }
        running_task_count: { type: integer }
        failed_task_count: { type: integer }
        status: { type: string, enum: [ active, deleted ] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: true
    CanvasRun:
      type: object
      required: [ id, canvas_id, node_id, submitted_revision, task_kind, task_id, status ]
      properties:
        id: { type: string, format: uuid }
        canvas_id: { type: string, format: uuid }
        node_id: { type: string }
        submitted_revision: { type: integer, format: int64 }
        task_kind: { type: string, enum: [ image, video ] }
        task_id: { type: string, format: uuid }
        status: { type: string, enum: [ submitting, queued, running, saving, succeeded, failed, canceled, attached, unplaced ] }
        result_asset_ids: { type: array, items: { type: string, format: uuid } }
        attached_revision: { type: integer, format: int64 }
        progress_stage: { type: string, description: Actual task-reported stage when refreshed }
        progress_message: { type: string, description: Actual task-reported progress message when refreshed }
      additionalProperties: true
    CanvasCreateRequest:
      type: object
      required: [ project_id, name ]
      properties: { project_id: { type: string, format: uuid }, name: { type: string, maxLength: 128 }, template: { type: string, enum: [ blank, image_exploration, image_to_video ] }, document: { $ref: '#/components/schemas/CanvasDocument' } }
      additionalProperties: false
    CanvasRenameRequest:
      type: object
      required: [ name, expected_metadata_version ]
      properties: { name: { type: string, maxLength: 128 }, expected_metadata_version: { type: integer, format: int64, minimum: 1 } }
      additionalProperties: false
    CanvasResponse: { type: object, required: [ data ], properties: { data: { $ref: '#/components/schemas/Canvas' }, meta: { type: object } }, additionalProperties: false }
    CanvasListResponse: { type: object, required: [ data ], properties: { data: { type: object, required: [ items ], properties: { items: { type: array, items: { $ref: '#/components/schemas/Canvas' } } } }, meta: { type: object } }, additionalProperties: false }
    CanvasRunResponse: { type: object, required: [ data ], properties: { data: { $ref: '#/components/schemas/CanvasRun' }, meta: { type: object } }, additionalProperties: false }
    CanvasRunListResponse: { type: object, required: [ data ], properties: { data: { type: object, required: [ items ], properties: { items: { type: array, items: { $ref: '#/components/schemas/CanvasRun' } } } }, meta: { type: object } }, additionalProperties: false }
    VideoPromptVariableBinding:
      type: object
      required: [ name, value ]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        value: { type: string }
      additionalProperties: false
    VideoReferenceBinding:
      type: object
      required: [ name, asset_id ]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        asset_id: { type: string, format: uuid }
      additionalProperties: false
    VideoInputRequest:
      type: object
      required: [ asset_id, role, ordinal ]
      properties:
        asset_id: { type: string, format: uuid }
        role: { type: string, enum: [ first_frame, last_frame ] }
        ordinal: { type: integer, minimum: 0 }
      additionalProperties: false
    VideoTaskEstimateRequest:
      type: object
      required: [ project_id, route_model_code, task_type, prompt_template, duration_seconds, resolution, aspect_ratio, audio_mode, output_count ]
      properties:
        project_id: { type: string, format: uuid }
        route_model_code: { type: string, minLength: 1, maxLength: 64 }
        task_type: { type: string, enum: [ text_to_video, image_to_video, first_last_frame_to_video ] }
        prompt_template: { type: string }
        prompt_variables:
          type: array
          items: { $ref: '#/components/schemas/VideoPromptVariableBinding' }
        reference_bindings:
          type: array
          items: { $ref: '#/components/schemas/VideoReferenceBinding' }
        inputs:
          type: array
          items: { $ref: '#/components/schemas/VideoInputRequest' }
        duration_seconds: { type: integer, minimum: 1 }
        resolution: { type: string }
        aspect_ratio: { type: string }
        audio_mode: { type: string, enum: [ silent, generated ] }
        output_count: { type: integer, minimum: 1, maximum: 4 }
      additionalProperties: false
