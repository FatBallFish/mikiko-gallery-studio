      operationId: postAgentAPIKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                total_quota_points: { type: string, pattern: '^\d+(\.\d{1,5})?$' }
                daily_quota_points: { type: string, pattern: '^\d+(\.\d{1,5})?$' }
                rpm_limit: { type: integer, minimum: 1 }
                expires_at: { type: string, format: date-time }
      responses:
        '201':
          description: API key created; secret is shown once
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
