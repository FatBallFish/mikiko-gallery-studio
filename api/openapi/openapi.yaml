      summary: Get current user's API key metadata
      operationId: getAgentAPIKey
      security:
        - bearerAuth: []
      parameters:
        - name: key_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: API key metadata
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
    put:
      tags: [Agent User]
      summary: Update current user's API key metadata or status
      operationId: putAgentAPIKey
      security:
        - bearerAuth: []
      parameters:
        - name: key_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                status: { type: string, enum: [active, disabled, revoked] }
                total_quota_points: { type: string, pattern: '^\d+(\.\d{1,5})?$' }
                daily_quota_points: { type: string, pattern: '^\d+(\.\d{1,5})?$' }
                rpm_limit: { type: integer, minimum: 1 }
                expires_at: { type: string, format: date-time }
      responses:
        '200':
          description: API key updated
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
        '400':
          description: Invalid update payload
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
        '401':
          description: Missing or invalid user token
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
    delete:
      tags: [Agent User]
      summary: Revoke and delete current user's API key
      operationId: deleteAgentAPIKey
      security:
        - bearerAuth: []
      parameters:
        - name: key_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: API key revoked
