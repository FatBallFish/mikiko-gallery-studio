openapi: 3.1.0
info:
  title: Pic Gallery API
  version: 0.2.0
  description: >-
    P0 baseline contract for Pic Gallery, including Agent API, Open API,
    OpenAI-compatible image APIs, and admin configuration endpoints.
servers:
  - url: http://localhost:8080
    description: Local API server
tags:
  - name: Health
  - name: Bootstrap
  - name: Setup
  - name: Agent Auth
  - name: Agent User
  - name: Agent Features
  - name: Agent Billing
  - name: Agent Cashier
  - name: Agent Projects
  - name: Agent Image
  - name: Agent Media
  - name: Agent Text
  - name: Open Image API
  - name: Admin Config
  - name: Admin Security Config
  - name: Admin Storage Config
  - name: Admin Auth
  - name: Admin Users
  - name: Admin Redeem Codes
  - name: Admin Call Records
  - name: Admin Model Routing
  - name: Admin Text Models
  - name: Admin Gallery
  - name: Admin Metrics
  - name: Admin Readiness
  - name: Admin Cluster
  - name: Cluster Enrollment
  - name: Admin Cashier
  - name: OpenAI Compat
paths:
  /:
    get:
      tags: [Health]
      summary: Service bootstrap status
      operationId: getRoot
      responses:
        '200':
          description: Service is running
          headers:
            X-Request-Id:
              $ref: ./components/parameters/common.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealthz
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
  /readyz:
    get:
      tags: [Health]
      summary: Readiness check
      operationId: getReadyz
      responses:
        '200':
          description: API is ready
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
        '503':
          description: Normal business traffic is unavailable during setup or fail-closed startup
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /setup:
    get:
      tags: [Setup]
      summary: Open the API-hosted first-run setup page
      description: Registered only while setup is pending. Normal and broken startup modes return 404.
      operationId: getSetupPage
      responses:
        '200':
          description: No-store setup page with restrictive browser security headers
          content:
            text/html:
              schema:
                type: string
  /api/system/v1/bootstrap-status:
    get:
      tags: [Bootstrap]
      summary: Get the secret-free API bootstrap state
      operationId: getBootstrapStatus
      responses:
        '200':
          description: Current setup, restart, ready, or fail-closed state
          content:
            application/json:
              schema:
                $ref: ./components/schemas/setup.yaml#/components/schemas/BootstrapStatusResponse
  /api/setup/v1/session:
    post:
      tags: [Setup]
      summary: Exchange the one-time setup credential for a browser session
      description: Available only while setup is pending. The setup credential remains reusable until setup completes.
      operationId: postSetupSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/setup.yaml#/components/schemas/SetupSessionRequest
      responses:
        '200':
          description: Setup session cookie created with an optional interrupted operation to resume
          content:
            application/json:
              schema:
                $ref: ./components/schemas/setup.yaml#/components/schemas/SetupSessionResponse
        '400':
          description: SETUP_INVALID_JSON
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '401':
          description: SETUP_CREDENTIALS_INVALID
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '409':
          description: SETUP_COMPLETED
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '500':
          description: SETUP_INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/setup/v1/probes/database:
    post:
      tags: [Setup]
      summary: Verify the proposed PostgreSQL connection and privileges
      description: Available only while setup is pending and requires a setup session.
      operationId: postSetupDatabaseProbe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/setup.yaml#/components/schemas/SetupDatabaseProbeRequest
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema:
                $ref: ./components/schemas/setup.yaml#/components/schemas/SetupProbeResponse
        '400':
          description: SETUP_INVALID_JSON
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '401':
          description: Invalid or missing setup session
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/setup/v1/probes/redis:
    post:
      tags: [Setup]
      summary: Verify the proposed Redis connection and read/write behavior
      description: Available only while setup is pending and requires a setup session.
      operationId: postSetupRedisProbe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/setup.yaml#/components/schemas/SetupRedisProbeRequest
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema:
                $ref: ./components/schemas/setup.yaml#/components/schemas/SetupProbeResponse
        '400':
          description: SETUP_INVALID_JSON
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '401':
          description: Invalid or missing setup session
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/setup/v1/probes/storage:
    post:
      tags: [Setup]
      summary: Verify the proposed local or S3-compatible object storage
      description: Available only while setup is pending and requires a setup session.
      operationId: postSetupStorageProbe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/setup.yaml#/components/schemas/SetupStorageProbeRequest
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema:
                $ref: ./components/schemas/setup.yaml#/components/schemas/SetupProbeResponse
        '400':
          description: SETUP_INVALID_JSON
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '401':
          description: Invalid or missing setup session
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/setup/v1/apply:
    post:
      tags: [Setup]
      summary: Validate and commit first-run initialization
      description: Available only while setup is pending and requires a setup session.
      operationId: postSetupApply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/setup.yaml#/components/schemas/SetupApplyRequest
      responses:
        '202':
          description: Setup operation accepted and advanced
          content:
            application/json:
              schema:
                $ref: ./components/schemas/setup.yaml#/components/schemas/SetupOperationResponse
        '400':
          description: SETUP_INVALID_JSON, SETUP_VALIDATION_FAILED, or SETUP_PROBE_FAILED
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '401':
          description: Invalid or missing setup session
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '409':
          description: SETUP_OPERATION_CONFLICT or SETUP_FIRST_ADMIN_CONFLICT
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '404':
          description: SETUP_OPERATION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '408':
          description: SETUP_REQUEST_CANCELLED
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '500':
          description: SETUP_INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '504':
          description: SETUP_REQUEST_TIMEOUT
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/setup/v1/progress/{operation_id}:
    get:
      tags: [Setup]
      summary: Get setup operation progress
      description: Available only while setup is pending and requires a setup session.
      operationId: getSetupProgress
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current setup operation state
          content:
            application/json:
              schema:
                $ref: ./components/schemas/setup.yaml#/components/schemas/SetupOperationResponse
        '400':
          description: SETUP_VALIDATION_FAILED or SETUP_PROBE_FAILED
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '401':
          description: Invalid or missing setup session
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '404':
          description: SETUP_OPERATION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '408':
          description: SETUP_REQUEST_CANCELLED
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '409':
          description: SETUP_OPERATION_CONFLICT
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '500':
          description: SETUP_INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '504':
          description: SETUP_REQUEST_TIMEOUT
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics endpoint
      operationId: getMetrics
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string
  /api/agent/auth/v1/email/send-code:
    post:
      tags: [Agent Auth]
      summary: Send email verification code
      operationId: postAgentAuthSendCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/SendEmailCodeRequest
      responses:
        '202':
          description: Verification code accepted for delivery
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/agent/auth/v1/login/email-code:
    post:
      tags: [Agent Auth]
      summary: Login or register with email code
      operationId: postAgentAuthEmailLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/EmailCodeLoginRequest
      responses:
        '200':
          description: Login succeeded or password setup is required before a session can be issued
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/EmailCodeLoginResponse
  /api/agent/auth/v1/password/setup:
    post:
      tags: [Agent Auth]
      summary: Complete mandatory first-login password setup
      operationId: postAgentAuthPasswordSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/PasswordSetupRequest
      responses:
        '200':
          description: Password configured and first normal session issued
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/SessionResponse
  /api/agent/auth/v1/login/password:
    post:
      tags: [Agent Auth]
      summary: Login with password
      operationId: postAgentAuthPasswordLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/PasswordLoginRequest
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/SessionResponse
  /api/agent/auth/v1/session/refresh:
    post:
      tags: [Agent Auth]
      summary: Refresh user session
      operationId: postAgentAuthRefresh
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/SessionResponse
  /api/agent/auth/v1/logout:
    post:
      tags: [Agent Auth]
      summary: Logout current session
      operationId: postAgentAuthLogout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/StatusMessageResponse
  /api/agent/auth/v1/password/change:
    post:
      tags: [Agent Auth]
      summary: Change current user password
      operationId: postAgentAuthPasswordChange
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/PasswordChangeRequest
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/StatusMessageResponse
  /api/agent/auth/v1/password/reset/request:
    post:
      tags: [Agent Auth]
      summary: Request a password reset code
      operationId: postAgentAuthPasswordResetRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/PasswordResetRequest
      responses:
        '202':
          description: Reset request accepted
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/StatusMessageResponse
  /api/agent/auth/v1/password/reset/confirm:
    post:
      tags: [Agent Auth]
      summary: Confirm password reset with email code
      operationId: postAgentAuthPasswordResetConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/PasswordResetConfirmRequest
      responses:
        '200':
          description: Password reset completed
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/StatusMessageResponse
  /api/agent/user/v1/profile:
    get:
      tags: [Agent User]
      summary: Get current user profile
      operationId: getAgentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/UserProfileResponse
    put:
      tags: [Agent User]
      summary: Update current user profile
      operationId: putAgentUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/UpdateUserProfileRequest
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/UserProfileResponse
  /api/agent/user/v1/account/close:
    post:
      tags: [Agent User]
      summary: Close current user account
      operationId: postAgentUserAccountClose
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account closed
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/StatusMessageResponse
  /api/agent/billing/v1/balance:
    get:
      tags: [Agent Billing]
      summary: Get points balance summary
      operationId: getAgentBalance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Balance summary
          headers:
            X-Request-Id:
              $ref: ./components/parameters/common.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/BalanceResponse
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/agent/billing/v1/ledger:
    get:
      tags: [Agent Billing]
      summary: Get points ledger entries
      operationId: getAgentLedger
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        '200':
          description: Ledger page
          headers:
            X-Request-Id:
              $ref: ./components/parameters/common.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/PointLedgerPageResponse
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/agent/billing/v1/plans:
    get:
      tags: [Agent Billing]
      summary: List subscription plans
      operationId: getAgentBillingPlans
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription plans
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/SubscriptionPlanListResponse
  /api/agent/billing/v1/subscription:
    get:
      tags: [Agent Billing]
      summary: Get active subscription
      operationId: getAgentBillingSubscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active subscription snapshot
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/UserSubscriptionResponse
  /api/agent/billing/v1/orders:
    get:
      tags: [Agent Billing]
      summary: List payment orders
      operationId: getAgentBillingOrders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, default: 20}
        - name: order_no
          in: query
          description: Fuzzy match payment order number.
          schema: {type: string}
        - name: user_id
          in: query
          schema: {type: integer, minimum: 1}
        - name: status
          in: query
          schema: {type: string}
        - name: visible_method
          in: query
          schema: {type: string, enum: [mock, alipay, wxpay]}
        - name: provider_type
          in: query
          schema: {type: string}
        - name: purchase_type
          in: query
          schema: {type: string, enum: [plan, custom_amount]}
      responses:
        '200':
          description: Payment orders
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/PaymentOrderListResponse
    post:
      tags: [Agent Billing]
      summary: Create a payment order
      operationId: postAgentBillingOrders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/PaymentOrderCreateRequest
      responses:
        '201':
          description: Payment order created
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/PaymentOrderResponse
  /api/agent/billing/v1/orders/{order_id}:
    get:
      tags: [Agent Billing]
      summary: Get payment order detail
      operationId: getAgentBillingOrderDetail
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Payment order detail
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/PaymentOrderResponse
  /api/agent/billing/v1/orders/{order_id}/cancel:
    post:
      tags: [Agent Billing]
      summary: Cancel a pending payment order
      operationId: postAgentBillingOrderCancel
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Payment order canceled
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/PaymentOrderResponse
  /api/agent/cashier/v1/options:
    get:
      tags: [Agent Cashier]
      summary: Get cashier recharge plans, custom amount config, and visible payment methods
      operationId: getAgentCashierOptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cashier options
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/CashierOptionsResponse
  /api/agent/cashier/v1/orders:
    get:
      tags: [Agent Cashier]
      summary: List current user's cashier orders
      operationId: getAgentCashierOrders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, default: 20}
      responses:
        '200':
          description: Cashier payment orders
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/PaymentOrderListResponse
    post:
      tags: [Agent Cashier]
      summary: Create a cashier recharge order
      operationId: postAgentCashierOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./components/parameters/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/CashierOrderCreateRequest
      responses:
        '201':
          description: Cashier order created
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/CashierOrderResponse
  /api/agent/cashier/v1/orders/{order_id}:
    get:
      tags: [Agent Cashier]
      summary: Get cashier order detail
      operationId: getAgentCashierOrder
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Cashier order detail
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/CashierOrderResponse
  /api/agent/cashier/v1/orders/{order_id}/cancel:
    post:
      tags: [Agent Cashier]
      summary: Cancel a pending cashier order
      operationId: postAgentCashierOrderCancel
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Cashier order canceled
          content:
