              type: string
              enum: [VIDEO_FIELD_INVALID, VIDEO_INPUT_INVALID, VIDEO_QUOTE_STALE, IDEMPOTENCY_KEY_REUSED, VIDEO_CAPABILITY_MISMATCH, BILLING_INSUFFICIENT_POINTS, NOT_FOUND, CONFLICT, INTERNAL_ERROR]
