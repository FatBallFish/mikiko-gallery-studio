  /api/agent/media/v1/assets:
    get:
      tags: [ Agent Media ]
      summary: List unified image, video, and audio assets
      operationId: listAgentMediaAssets
      security:
        - bearerAuth: []
      parameters:
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: media_type, in: query, schema: { type: string, enum: [ image, video, audio ] } }
        - { name: source_type, in: query, schema: { type: string } }
        - { name: group_name, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - name: visibility_status
          in: query
          description: Publication state applied before pagination. Empty or all returns every publication state; reviewing/pending_review are aliases for pending, approved for public, and unpublished for offline.
          schema:
            type: string
            enum: [all, private, pending, public, rejected, offline, reviewing, pending_review, approved, unpublished]
        - { name: keyword, in: query, schema: { type: string } }
        - { name: sort_by, in: query, schema: { type: string } }
        - { name: sort_order, in: query, schema: { type: string, enum: [ asc, desc ] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Unified media page, including compatible projections of unbackfilled images
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
  /api/agent/video/v1/capabilities:
    get:
      tags: [ Agent Media ]
      summary: Get verified video combinations for one route model
      operationId: getAgentVideoCapabilities
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: route_model_code, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Candidate-backed capability union with conservative input constraints shared by routable candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      route_model_code: { type: string }
                      input_capabilities_by_task_type:
                        type: object
                        description: Input constraints by task type then input role; absent roles are unsupported. Counts come from verified provider capabilities.
                        additionalProperties:
                          type: object
                          additionalProperties:
                            type: object
                            required: [required, max_count, media_types, formats, max_bytes]
                            properties:
                              required: { type: boolean }
                              max_count: { type: integer, description: Negative means unlimited; zero rejects the role. }
                              media_types: { type: array, items: { type: string } }
                              formats: { type: array, items: { type: string } }
                              max_bytes: { type: integer, format: int64, description: Zero means no byte limit. }
        '404': { description: Route model not found }
        '409': { description: No verified enabled candidate }
  /api/agent/video/v1/estimates:
    post:
      tags: [ Agent Media ]
      summary: Validate a complete video combination and create a 120-second signed quote
      operationId: postAgentVideoEstimate
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VideoTaskEstimateRequest' }
      responses:
        '200':
          description: Signed version-bound video quote
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoEstimateResponse' } } }
        '400':
          description: Invalid field or input asset
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoErrorResponse' } } }
        '404':
          description: Project, route model, or input asset not found for the current user
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoErrorResponse' } } }
        '409':
          description: Pricing or verified capability is unavailable
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoErrorResponse' } } }
        '422':
          description: No candidate supports the complete parameter combination
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoErrorResponse' } } }
  /api/agent/video/v1/tasks:
    get:
      tags: [ Agent Media ]
      summary: List the current user's video tasks
      operationId: listAgentVideoTasks
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [ queued, running, saving, succeeded, partial, failed, cancelled ] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Video task page
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoTaskPageResponse' } } }
        '400':
          description: Invalid project, cursor, status, or limit
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoErrorResponse' } } }
    post:
      tags: [ Agent Media ]
      summary: Create an asynchronous video task from a signed quote
      operationId: createAgentVideoTask
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VideoTaskCreateRequest' }
      responses:
        '202':
          description: Video task accepted
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoTaskResponse' } } }
        '200':
          description: Idempotent replay of an existing task
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoTaskResponse' } } }
        '400':
          description: Invalid field or input asset
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoErrorResponse' } } }
        '402':
          description: Insufficient available points for the reservation
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoErrorResponse' } } }
        '404':
          description: Project, route model, or input asset not found for the current user
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoErrorResponse' } } }
        '409':
          description: IDEMPOTENCY_KEY_REUSED or VIDEO_QUOTE_STALE
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoErrorResponse' } } }
        '422':
          description: VIDEO_CAPABILITY_MISMATCH
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoErrorResponse' } } }
  /api/agent/video/v1/tasks/events:
    get:
      tags: [ Agent Media ]
      summary: Stream video task projections
      operationId: streamAgentVideoTasks
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: project_id, in: query, schema: { type: string, format: uuid }, description: Limit events to one owned project. }
        - { name: after, in: query, schema: { type: string }, description: Resume after this event ID; takes precedence over Last-Event-ID. }
        - { name: Last-Event-ID, in: header, schema: { type: string }, description: Resume after this event ID when the after query parameter is absent. }
      responses:
        '200':
          description: Server-sent task events. Each event has an id line and a compact projection without prompts, pricing, inputs, or signed URLs.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/VideoTaskEventProjection'
  /api/agent/video/v1/tasks/{task_id}:
    get:
      tags: [ Agent Media ]
      summary: Get a video task
      operationId: getAgentVideoTask
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Video task
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoTaskResponse' } } }
        '404':
