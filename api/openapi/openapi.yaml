        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          description: Owned project to list. Omission uses the service's compatibility behavior.
          schema: { type: string }
      responses:
        '200':
          description: History task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ./components/schemas/common.yaml#/components/schemas/ImageTask
  /api/agent/image/v1/history/tasks/{task_id}:
    get:
      tags: [ Agent Image ]
      summary: Get history task detail
      operationId: getAgentHistoryTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./components/parameters/common.yaml#/components/parameters/TaskId
      responses:
        '200':
          description: History task detail
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/ImageTaskResponse
    delete:
      tags: [ Agent Image ]
      summary: Hide a history task from the current user
      description: Hides owned succeeded, partial_failed, failed or rejected tasks; retains task records, assets and references. Active tasks return 409.
      operationId: deleteAgentHistoryTask
