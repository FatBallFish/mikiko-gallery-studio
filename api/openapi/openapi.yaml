          content: { application/json: { schema: { $ref: '#/components/schemas/VideoErrorResponse' } } }
  /api/agent/video/v1/tasks/{task_id}:cancel:
    post:
      tags: [ Agent Media ]
      summary: Request cancellation of a video task
      operationId: cancelAgentVideoTask
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        '202':
          description: Cancellation accepted. Replays for a task are monotonic and return its current projection without advancing an already requested or terminal item again.
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoTaskResponse' } } }
        '400':
          description: Missing or invalid Idempotency-Key
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoErrorResponse' } } }
        '404':
          description: Video task does not exist or is not owned by the current user
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoErrorResponse' } } }
  /api/open/video/v1/provider-callbacks/{provider_code}/{account_public_id}:
