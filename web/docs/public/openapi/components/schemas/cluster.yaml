components:
  schemas:
    ClusterToken:
      type: object
      required: [token_id, installation_id, role, expires_at, created_by, created_at, updated_at]
      properties:
        token_id: { type: string, format: uuid }
        installation_id: { type: string }
        role: { type: string, enum: [api, worker, web] }
        expires_at: { type: string, format: date-time }
        consumed_at: { type: string, format: date-time }
        consumed_by_node_id: { type: string }
        revoked_at: { type: string, format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClusterNodeStatus:
      type: object
      required: [node_id, installation_id, role, application_version, runtime_schema_version, config_revision, health, effective_health, application_version_drift, runtime_schema_drift, config_revision_drift, created_at, updated_at]
      properties:
        node_id: { type: string }
        installation_id: { type: string }
        role: { type: string, enum: [single, control, api, worker, web] }
        application_version: { type: string }
        runtime_schema_version: { type: integer, minimum: 1 }
        config_revision: { type: integer, format: int64, minimum: 0 }
        health: { type: string, enum: [joining, healthy, degraded, unready, offline] }
        effective_health: { type: string, enum: [joining, healthy, degraded, unready, offline] }
        last_error: { type: string, maxLength: 1024 }
        last_heartbeat_at: { type: string, format: date-time }
        application_version_drift: { type: boolean }
        runtime_schema_drift: { type: boolean }
        config_revision_drift: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClusterNodeListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ClusterNodeStatus' }
            pagination:
              $ref: './common.yaml#/components/schemas/Pagination'
    ClusterTokenCreateRequest:
      type: object
      additionalProperties: false
      required: [role, ttl_seconds]
      properties:
        role: { type: string, enum: [api, worker, web] }
        ttl_seconds: { type: integer, minimum: 60, maximum: 86400 }
    ClusterTokenIssued:
      type: object
      required: [token, credential]
      properties:
        token:
          $ref: '#/components/schemas/ClusterToken'
        credential:
          type: string
          format: password
          readOnly: true
          description: Returned once. The server persists only a one-way hash.
    ClusterTokenResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ClusterToken'
    ClusterTokenIssuedResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ClusterTokenIssued'
    ClusterTokenListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ClusterToken'
            pagination:
              $ref: './common.yaml#/components/schemas/Pagination'
    ClusterChallengeRequest:
      type: object
      additionalProperties: false
      required: [protocol, token_id, node_id, node_public_key, application_version, runtime_schema_version]
      properties:
        protocol: { type: string, enum: [pg-cluster-enrollment-v1] }
        token_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        node_public_key:
          type: string
          minLength: 43
          maxLength: 43
          writeOnly: true
        application_version: { type: string }
        runtime_schema_version: { type: integer, minimum: 1 }
    ClusterChallenge:
      type: object
      required: [protocol, challenge_id, installation_id, token_id, role, node_id, client_public_key, server_public_key, server_nonce, application_version, runtime_schema_version, config_revision, expires_at]
      properties:
        protocol: { type: string, enum: [pg-cluster-enrollment-v1] }
        challenge_id: { type: string, format: uuid }
        installation_id: { type: string, format: uuid }
        token_id: { type: string, format: uuid }
        role: { type: string, enum: [api, worker, web] }
        node_id: { type: string, format: uuid }
        client_public_key: { type: string, readOnly: true }
        server_public_key: { type: string, readOnly: true }
        server_nonce: { type: string, readOnly: true }
        application_version: { type: string }
        runtime_schema_version: { type: integer, minimum: 1 }
        config_revision: { type: integer, format: int64, minimum: 1 }
        expires_at: { type: string, format: date-time }
    ClusterChallengeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ClusterChallenge'
    ClusterJoinRequest:
      type: object
      additionalProperties: false
      required: [protocol, challenge_id, proof]
      properties:
        protocol: { type: string, enum: [pg-cluster-enrollment-v1] }
        challenge_id: { type: string, format: uuid }
        proof:
          type: string
          writeOnly: true
    ClusterJoinEnvelope:
      type: object
      required: [protocol, installation_id, node_id, role, application_version, runtime_schema_version, config_revision, expires_at, encrypted_envelope]
      properties:
        protocol: { type: string, enum: [pg-cluster-enrollment-v1] }
        installation_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        role: { type: string, enum: [api, worker, web] }
        application_version: { type: string }
        runtime_schema_version: { type: integer, minimum: 1 }
        config_revision: { type: integer, format: int64, minimum: 1 }
        expires_at: { type: string, format: date-time }
        encrypted_envelope:
          type: object
          additionalProperties: false
          required: [algorithm, nonce, ciphertext]
          properties:
            algorithm: { type: string, enum: [X25519-HKDF-SHA256-XCHACHA20-POLY1305] }
            nonce: { type: string, readOnly: true }
            ciphertext: { type: string, readOnly: true }
          readOnly: true
          description: Authenticated ciphertext containing only role-allowed runtime fields.
    ClusterJoinResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ClusterJoinEnvelope'
