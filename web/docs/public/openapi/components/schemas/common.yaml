        moderation:
          type: string
        requested_output_image_count:
          type: integer
          minimum: 1
        url:
          type: string
        download_url:
          type: string
        mime_type:
          type: string
        file_size_bytes:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        visibility_status:
          type: string
        published_at:
          type: string
          format: date-time
        author_name:
          type: string
        like_count:
          type: integer
        favorite_count:
          type: integer
        liked_by_viewer:
          type: boolean
        favorited_by_viewer:
          type: boolean
        created_at:
          type: string
          format: date-time
    PublicGalleryListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PublicGalleryListImage'
            pagination:
              $ref: '#/components/schemas/Pagination'
    PublicGalleryDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PublicGalleryDetailImage'
