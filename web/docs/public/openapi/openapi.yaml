      type: apiKey
      in: query
      name: access_token
      description: Administrator access token fallback when Authorization is absent; requires manage:reviews.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    developerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: Developer API Key. Scopes, current user/key state, expiry, RPM and total/day quota are enforced on each operation. Never send tokens in URLs.
