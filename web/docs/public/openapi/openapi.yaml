              schema:
                $ref: "#/components/schemas/OAuthError"
  /oauth/authorize:
    get:
      tags:
        - OAuth
      summary: GET /oauth/authorize
      description: Browser authorization redirect to stored Studio consent request. response_type=code, code_challenge_method=S256, exact redirect URI and resource binding. No password tool.
      security: []
      parameters:
        - name: response_type
          in: query
          schema:
            type: string
          required: true
        - name: client_id
          in: query
          schema:
            type: string
          required: true
        - name: redirect_uri
          in: query
          schema:
            type: string
          required: true
        - name: resource
          in: query
          schema:
            type: string
          required: true
        - name: scope
          in: query
          schema:
            type: string
          required: true
        - name: code_challenge
          in: query
          schema:
            type: string
          required: true
        - name: code_challenge_method
          in: query
          schema:
            type: string
          required: true
        - name: state
          in: query
          schema:
            type: string
          required: false
      responses:
        "303":
          description: Redirect to Studio browser consent
          headers:
            Location:
              schema:
                type: string
        "400":
          description: Invalid OAuth request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oauth/token:
    post:
      tags:
        - OAuth
      summary: POST /oauth/token
      description: Code exchange requires code, redirect_uri and PKCE verifier; refresh requires refresh_token. Header client authentication and URL query tokens are rejected. Refresh reuse revokes grant family.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                client_id: &a41
                  type: string
                resource: *a41
                code: *a41
                redirect_uri: *a41
                code_verifier: *a41
                refresh_token: *a41
                scope: *a41
              required:
                - grant_type
                - client_id
                - resource
              additionalProperties: false
      responses:
        "200":
          description: OAuth response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        "400":
          description: Invalid OAuth request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oauth/revoke:
    post:
      tags:
        - OAuth
      summary: POST /oauth/revoke
      description: Revoke grant associated with access/refresh token; does not end all browser sessions.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                  writeOnly: true
                client_id:
                  type: string
              required:
                - token
                - client_id
              additionalProperties: false
      responses:
        "200":
          description: OAuth response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid OAuth request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oauth/register:
    post:
      tags:
        - OAuth
      summary: POST /oauth/register
      description: Bounded dynamic public-client registration when enabled. Safe Client ID Metadata Documents and pre-registration also supported.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthClient"
      responses:
        "201":
          description: OAuth response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClient"
        "400":
          description: Invalid OAuth request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /mcp:
    post:
      tags:
        - MCP
      summary: MCP Streamable HTTP
      description: Official Go SDK v1.7.0; protocol 2026-07-28 plus supported prior SDK versions. Initialize, tools/list and tools/call. Browser OAuth only, canonical resource audience. Tool structuredContent and JSON text wrap Execute result in data. Discover actual input/output schemas and annotations using tools/list. No password-login tool, arbitrary URL import or large inline base64 file tools.
      security:
        - mcpOAuth: []
      parameters:
        - name: MCP-Protocol-Version
          in: header
          schema: &a42
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: MCP JSON-RPC message
      responses:
        "200":
          description: MCP JSON or SSE result
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema: *a42
        "202":
          description: Notification accepted
        "401":
          description: Bearer challenge with protected resource metadata
          headers:
            WWW-Authenticate:
              schema: *a42
