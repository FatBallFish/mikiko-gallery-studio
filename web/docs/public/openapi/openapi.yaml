    CanvasNode:
      description: Schema 1 integrated image_v2/video_v2 nodes are empty generation nodes when asset_id is absent, or filled media when present. Empty nodes are valid alone. Only empty v2 nodes accept estimate/generate. Legacy prompt/image/video/ image_generation/video_generation nodes remain readable and deletable; mutations may only retain their IDs and content unchanged. Canvas duplication containing legacy nodes is rejected. Existing legacy runs remain recoverable.
      type: object
      required:
        - id
        - type
        - position
        - size
      properties:
        id:
          type: string
          maxLength: 64
        type:
          type: string
          enum:
            - image_v2
            - video_v2
            - prompt
            - image
            - video
            - audio
            - image_generation
            - video_generation
