  /.well-known/oauth-authorization-server:
    get:
      tags:
        - OAuth
      summary: GET /.well-known/oauth-authorization-server
      description: RFC 8414 metadata. Canonical configured HTTPS issuer, HTTP loopback development only. PKCE S256, public clients, authorization_code and refresh_token.
      security: []
      responses:
        "200":
          description: OAuth response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
