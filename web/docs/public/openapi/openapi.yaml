  /api/open/v1/me:
    get:
      tags:
        - Developer API
      operationId: get_current_user
      summary: get current user
      description: Requires account:read.
      security:
        - developerBearerAuth: []
      x-required-scopes:
        - account:read
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    $ref: ./components/schemas/native.generated.json#/$defs/get_current_userOutput
                  meta:
                    properties:
                      request_id:
                        type: string
                    required:
                      - request_id
                    type: object
                required:
                  - data
                  - meta
                type: object
          description: Successful response
        "400":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Invalid input or unsupported parameter
        "401":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Missing, expired, revoked or disabled credential/account
        "402":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Insufficient balance
        "403":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Required scope or quota not available
        "404":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Resource not found or not owned
        "409":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Version conflict, IDEMPOTENCY_CONFLICT or QUOTE_STALE
        "429":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Rate limit exceeded
        "500":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Operation unavailable or internal error
        "503":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Native API error; see error.code and meta.request_id.
  /api/open/v1/me/balance:
    get:
      tags:
        - Developer API
      operationId: get_balance
      summary: get balance
      description: Requires account:read.
      security:
        - developerBearerAuth: []
      x-required-scopes:
        - account:read
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    $ref: ./components/schemas/native.generated.json#/$defs/get_balanceOutput
                  meta:
                    properties:
                      request_id:
                        type: string
                    required:
                      - request_id
                    type: object
                required:
                  - data
                  - meta
                type: object
          description: Successful response
        "400":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Invalid input or unsupported parameter
        "401":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Missing, expired, revoked or disabled credential/account
        "402":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Insufficient balance
        "403":
          content:
            application/json:
              schema:
