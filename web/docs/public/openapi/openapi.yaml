openapi: 3.1.0
info:
  title: Pic Gallery Developer API
  version: 0.2.0
  description: Public image generation APIs for native AK/SK integrations and OpenAI-compatible clients.
servers:
  - url: http://localhost:8080
    description: Local API server
tags:
  - name: Open Image API
  - name: Cluster Enrollment
  - name: OpenAI Compat
paths:
  /api/open/video/v1/provider-callbacks/{provider_code}/{account_public_id}:
    post:
      tags:
        - Open Media
      summary: Receive a signed callback from a configured video provider account
      operationId: receiveVideoProviderCallback
      parameters:
        - name: provider_code
          in: path
          required: true
          schema:
            type: string
            enum:
              - seedance
              - minimax
        - name: account_public_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Provider challenge response
        "202":
          description: Verified callback accepted idempotently
        "400":
          description: Invalid signature or callback payload
        "404":
          description: Callback endpoint not found
  /api/open/image/v1/reference-assets/uploads:
    post:
      tags:
        - Open Image API
      summary: Create an upload session for reference assets
      operationId: postOpenReferenceAssetUploadSession
      security:
        - accessKeyAuth: []
          accessTimestamp: []
          accessBodySHA256: []
          accessSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/openapi.yaml#/components/schemas/UploadSessionRequest
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: ./components/schemas/openapi.yaml#/components/schemas/UploadSessionResponse
  /api/open/image/v1/tasks:
    post:
      tags:
        - Open Image API
      summary: Create an image task through Open API
      operationId: postOpenImageTask
      security:
        - accessKeyAuth: []
          accessTimestamp: []
          accessBodySHA256: []
          accessSignature: []
      parameters:
        - $ref: ./components/parameters/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/agent.yaml#/components/schemas/CreateImageTaskRequest
      responses:
        "202":
          description: Task accepted
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/ImageTaskResponse
        "400":
          description: Invalid task request, including unsupported sync response_mode
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        "409":
          description: Capability snapshot changed (`capability_changed`); refresh capabilities and estimate before retrying
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/open/image/v1/estimate:
    get:
      tags:
        - Open Image API
      summary: Estimate task points through Open API
      operationId: getOpenEstimate
      security:
        - accessKeyAuth: []
          accessTimestamp: []
          accessBodySHA256: []
          accessSignature: []
      parameters:
        - $ref: ./components/parameters/common.yaml#/components/parameters/RouteModelCode
        - $ref: ./components/parameters/common.yaml#/components/parameters/AbstractModel
        - $ref: ./components/parameters/common.yaml#/components/parameters/SizeMode
        - $ref: ./components/parameters/common.yaml#/components/parameters/AspectRatio
        - $ref: ./components/parameters/common.yaml#/components/parameters/BaseResolution
        - $ref: ./components/parameters/common.yaml#/components/parameters/Quality
        - $ref: ./components/parameters/common.yaml#/components/parameters/OutputFormat
        - $ref: ./components/parameters/common.yaml#/components/parameters/OutputCompression
        - $ref: ./components/parameters/common.yaml#/components/parameters/Moderation
        - $ref: ./components/parameters/common.yaml#/components/parameters/RequestedSize
        - $ref: ./components/parameters/common.yaml#/components/parameters/OutputImageCount
        - $ref: ./components/parameters/common.yaml#/components/parameters/ReferenceImageCount
        - $ref: ./components/parameters/common.yaml#/components/parameters/TaskType
      responses:
        "200":
          description: Cost estimate
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/EstimateResponse
  /api/open/image/v1/gallery/images:
    get:
      tags:
        - Open Image API
      summary: List public gallery images
      operationId: getOpenGalleryImages
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - latest
              - hot
        - name: query
          in: query
          description: Keyword search over public image ID, prompt excerpt, model, task type, and author. Full prompts remain hidden from list responses.
          schema:
            type: string
        - name: route_model_code
          in: query
          schema:
            type: string
        - name: task_type
          in: query
          schema:
            type: string
        - name: liked
          in: query
          schema:
            type: boolean
        - name: favorited
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Public gallery images
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/PublicGalleryListResponse
  /api/open/image/v1/gallery/images/{image_id}:
    get:
      tags:
        - Open Image API
      summary: Get public gallery image detail
      operationId: getOpenGalleryImageDetail
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public gallery image detail
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/PublicGalleryDetailResponse
        "401":
          description: Login required for full prompt and viewer interaction state
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/open/image/v1/gallery/images/{image_id}/access:
    get:
      tags:
        - Open Image API
      summary: Project a fresh direct-storage URL for an approved public image
      operationId: getOpenGalleryImageAccess
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum:
              - preview
              - download
      responses:
        "200":
          description: Short-lived URL for an approved public image
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - url
                    properties:
                      url:
                        type: string
                        format: uri-reference
                      expires_at:
                        type: string
                        format: date-time
        "404":
          description: Image is not approved for public access
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/open/image/v1/payments/webhooks/{channel}:
    post:
      tags:
        - Open Image API
      summary: Payment provider webhook callback
      operationId: postOpenPaymentWebhook
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum:
              - alipay
              - wxpay
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
  /v1/images/generations:
    post:
      tags:
        - OpenAI Compat
      summary: OpenAI-compatible image generation endpoint
      operationId: postOpenAIImageGeneration
      security:
        - compatBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/openai-compat.yaml#/components/schemas/OpenAIImageGenerationRequest
      responses:
        "200":
          description: OpenAI-compatible image generation response
          content:
            application/json:
              schema:
                $ref: ./components/schemas/openai-compat.yaml#/components/schemas/OpenAIImageResponse
  /v1/images/edits:
    post:
      tags:
        - OpenAI Compat
      summary: OpenAI-compatible image edit endpoint
      operationId: postOpenAIImageEdit
      security:
        - compatBearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: ./components/schemas/openai-compat.yaml#/components/schemas/OpenAIImageEditRequest
      responses:
        "200":
          description: OpenAI-compatible image edit response
          content:
            application/json:
              schema:
                $ref: ./components/schemas/openai-compat.yaml#/components/schemas/OpenAIImageResponse
  /v1/models:
    get:
      tags:
        - OpenAI Compat
      summary: OpenAI-compatible model list
      operationId: getOpenAIModels
      security:
        - compatBearerAuth: []
      responses:
        "200":
          description: OpenAI-compatible models
          content:
            application/json:
              schema:
                $ref: ./components/schemas/openai-compat.yaml#/components/schemas/OpenAIModelListResponse
  /api/open/image/v1/reference-assets:
    post:
      tags:
        - Open Image API
      summary: Upload a reference asset using multipart form data
      operationId: postOpenReferenceAssetMultipart
      security:
        - accessKeyAuth: []
          accessTimestamp: []
          accessBodySHA256: []
          accessSignature: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Reference asset created
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/ReferenceAssetResponse
  /api/open/image/v1/reference-assets/{asset_id}:
    get:
      tags:
        - Open Image API
      summary: Get Open API reference asset metadata
      operationId: getOpenReferenceAsset
      security:
        - accessKeyAuth: []
          accessTimestamp: []
          accessBodySHA256: []
          accessSignature: []
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reference asset metadata
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/ReferenceAssetResponse
  /api/open/image/v1/tasks/{task_id}:
    get:
      tags:
        - Open Image API
      summary: Get Open API image task status and results
      operationId: getOpenTask
      security:
        - accessKeyAuth: []
          accessTimestamp: []
          accessBodySHA256: []
          accessSignature: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image task
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/ImageTaskResponse
  /api/open/image/v1/balance:
    get:
      tags:
        - Open Image API
      summary: Get Open API key user balance
      operationId: getOpenBalance
      security:
        - accessKeyAuth: []
          accessTimestamp: []
          accessBodySHA256: []
          accessSignature: []
      responses:
        "200":
          description: Balance summary
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/BalanceResponse
  /api/open/image/v1/capabilities:
    get:
      tags:
        - Open Image API
      summary: Get Open API image generation capabilities
      operationId: getOpenCapabilities
      security:
        - accessKeyAuth: []
          accessTimestamp: []
          accessBodySHA256: []
          accessSignature: []
      responses:
        "200":
          description: Capability list
          content:
            application/json:
              schema:
                $ref: ./components/schemas/agent.yaml#/components/schemas/CapabilitiesResponse
  /api/open/cluster/v1/challenges:
    post:
      tags:
        - Cluster Enrollment
      summary: Begin encrypted cluster enrollment
      operationId: createClusterChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/cluster.yaml#/components/schemas/ClusterChallengeRequest
      responses:
        "201":
          description: Short-lived challenge bound to the token, node, installation, version, and runtime schema
          content:
            application/json:
              schema:
                $ref: ./components/schemas/cluster.yaml#/components/schemas/ClusterChallengeResponse
        "400":
          description: Invalid or incompatible enrollment metadata
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        "401":
          description: Token is invalid, unavailable, revoked, consumed, or expired
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/open/cluster/v1/join:
    post:
      tags:
        - Cluster Enrollment
      summary: Complete encrypted cluster enrollment
      operationId: joinCluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/cluster.yaml#/components/schemas/ClusterJoinRequest
      responses:
        "201":
          description: Node registration and role-minimized encrypted runtime envelope
          content:
            application/json:
              schema:
                $ref: ./components/schemas/cluster.yaml#/components/schemas/ClusterJoinResponse
        "400":
          description: Invalid enrollment request
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        "401":
          description: Challenge or proof is invalid or expired
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        "409":
          description: Challenge or token was already consumed, or the node identity conflicts
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
components:
  parameters:
    AdminVideoResourceID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminVideoExpectedVersion:
      name: expected_version
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    CanvasID:
      name: canvas_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CanvasNodeID:
      name: node_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    CanvasRunID:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AdminVideoResponse:
      description: Video administration payload in the standard success envelope
      content:
        application/json:
          schema:
            $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
    AdminVideoSafetyConflict:
      description: Blocked by stale CAS, missing candidate/capability/cost/price, sales below server-calculated safety points, target margin, or point-product net income floor.
      content:
        application/json:
          schema:
            $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
  schemas:
    AgentFeatureFlags:
      type: object
      required:
        - video_creation
        - creative_canvas
        - media_upload
      properties:
        video_creation:
          type: boolean
        creative_canvas:
          type: boolean
        media_upload:
          type: boolean
      additionalProperties: false
    AgentFeatureFlagsResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/AgentFeatureFlags"
        meta:
          type: object
          additionalProperties: true
      additionalProperties: false
    AdminVideoCapabilityWrite:
      type: object
      required:
        - expected_version
        - capability_version
        - capability
        - validation_status
        - enabled
      properties:
        expected_version:
          type: string
        capability_version:
          type: string
          minLength: 1
          maxLength: 128
        capability:
          type: object
          required:
            - schema_version
            - provider_native_max_n
            - task_types
          properties:
            schema_version:
              type: integer
              const: 1
            provider_native_max_n:
              type: integer
              minimum: 1
              maximum: 10
              description: Provider-native n; platform output_count remains 1-4 and keeps existing split-task behavior.
            task_types:
              type: object
              minProperties: 1
              additionalProperties:
                type: object
          additionalProperties: true
        validation_status:
          type: string
          enum:
            - draft
            - verified
            - failed
        enabled:
          type: boolean
      additionalProperties: false
    AdminVideoCostRuleWrite:
      type: object
      required:
        - expected_rule_version
        - billing_mode
        - currency
        - rates
        - validation_status
        - effective_at
        - enabled
      properties:
        id:
          type: integer
          format: int64
        expected_rule_version:
          type: integer
          minimum: 0
        billing_mode:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
        rates:
          type: object
          required:
            - combinations
          additionalProperties: true
        validation_status:
          type: string
          enum:
            - draft
            - verified
            - failed
        effective_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        enabled:
          type: boolean
          description: Only verified cost rules may be enabled.
      additionalProperties: true
    AdminVideoStrategyWrite:
      type: object
      required:
        - expected_version
        - code
        - name
        - minimum_net_point_income_cny
        - payment_fee_rate
        - target_margin_rate
        - provider_cost_buffer_rate
        - enabled
      properties:
        expected_version:
          type: integer
          minimum: 0
        code:
          type: string
        name:
          type: string
        minimum_net_point_income_cny:
          type: string
          pattern: ^\d+(\.\d{1,5})?$
        payment_fee_rate:
          type: string
          pattern: ^0(\.\d{1,5})?$
        target_margin_rate:
          type: string
          pattern: ^0(\.\d{1,5})?$
        provider_cost_buffer_rate:
          type: string
          pattern: ^0(\.\d{1,5})?$
        enabled:
          type: boolean
          description: Bonus points dilute effective net CNY income per point and are included in the safety gate.
      additionalProperties: true
    AdminVideoSimulationRequest:
      type: object
      required:
        - route_model_id
        - task_type
        - resolution
        - audio_mode
        - duration_seconds
      properties:
        route_model_id:
          type: integer
          format: int64
          minimum: 1
        task_type:
          type: string
          enum:
            - text_to_video
            - image_to_video
            - first_last_frame_to_video
        resolution:
          type: string
        audio_mode:
          type: string
          enum:
            - silent
            - generated
        duration_seconds:
          type: integer
          minimum: 1
        reference_image_count:
          type: integer
          minimum: 0
      additionalProperties: false
    AdminVideoRecalculateRequest:
      type: object
      required:
        - route_model_id
        - combinations
        - effective_at
      properties:
        route_model_id:
          type: integer
          format: int64
          minimum: 1
        combinations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AdminVideoSimulationRequest"
        effective_at:
          type: string
          format: date-time
      additionalProperties: false
    AdminVideoPriceRuleWrite:
      type: object
      required:
        - route_model_id
        - pricing_strategy_id
        - expected_version
        - task_type
        - resolution
        - audio_mode
        - duration_seconds
        - effective_at
        - minimum_task_points
        - pricing_mode
        - enabled
      properties:
        route_model_id:
          type: integer
          format: int64
          minimum: 1
        pricing_strategy_id:
          type: integer
          format: int64
          minimum: 1
        expected_version:
          type: integer
          minimum: 0
        task_type:
          type: string
        resolution:
          type: string
        audio_mode:
          type: string
        duration_seconds:
          type: integer
          minimum: 1
        effective_at:
          type: string
          format: date-time
        minimum_task_points:
          type: string
          pattern: ^\d+(\.\d{1,5})?$
        pricing_mode:
          type: string
          enum:
            - exact
            - metered
        safety_points:
          type: string
          description: Informational only; server recalculates and overwrites from worst enabled candidate cost.
        enabled:
          type: boolean
      additionalProperties: true
    AdminVideoRouteConfigWrite:
      type: object
      required:
        - expected_version
        - config_version
        - pricing_strategy_id
        - task_types
        - visible_combinations
        - max_output_count
        - enabled
      properties:
        expected_version:
          type: string
        config_version:
          type: string
        pricing_strategy_id:
          type: integer
          format: int64
          minimum: 1
        task_types:
          type: array
          minItems: 1
          items:
            type: string
        visible_options:
          type: object
          additionalProperties: true
        defaults:
          type: object
          additionalProperties: true
        visible_combinations:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - task_type
              - resolution
              - audio_mode
              - duration_seconds
            properties:
              task_type:
                type: string
              resolution:
                type: string
              aspect_ratio:
                type: string
              audio_mode:
                type: string
              duration_seconds:
                type: integer
                minimum: 1
        max_output_count:
          type: integer
          minimum: 1
          maximum: 4
        enabled:
          type: boolean
      additionalProperties: false
    CanvasNode:
      type: object
      required:
        - id
        - type
        - position
        - size
      properties:
        id:
          type: string
          maxLength: 64
        type:
          type: string
          enum:
            - prompt
            - image
            - video
            - audio
            - image_generation
            - video_generation
            - note
        asset_id:
          type: string
          format: uuid
        position:
          type: object
          required:
            - x
            - y
          properties:
            x:
              type: number
            y:
              type: number
        size:
          type: object
          required:
            - width
            - height
          properties:
            width:
              type: number
            height:
              type: number
        payload:
          type: object
          additionalProperties: true
      additionalProperties: false
    CanvasEdge:
      type: object
      required:
        - id
        - source
        - target
        - input_role
      properties:
        id:
          type: string
          maxLength: 64
        source:
          type: string
          maxLength: 64
        target:
          type: string
          maxLength: 64
        source_handle:
          type: string
        target_handle:
          type: string
        input_role:
          type: string
          enum:
            - prompt
            - reference
            - first_frame
            - last_frame
            - result
        ordinal:
          type: integer
          minimum: 0
      additionalProperties: false
    CanvasDocument:
      type: object
      required:
        - schema_version
        - viewport
        - nodes
        - edges
      properties:
        schema_version:
          type: integer
          enum:
            - 1
        viewport:
          type: object
          required:
            - x
            - y
            - zoom
          properties:
            x:
              type: number
            y:
              type: number
            zoom:
              type: number
        nodes:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/CanvasNode"
        edges:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/CanvasEdge"
      additionalProperties: false
    Canvas:
      type: object
      required:
        - id
        - project_id
        - name
        - revision
        - metadata_version
        - document
        - node_count
        - edge_count
        - status
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        revision:
          type: integer
          format: int64
        metadata_version:
          type: integer
          format: int64
        document:
          $ref: "#/components/schemas/CanvasDocument"
        node_count:
          type: integer
        edge_count:
          type: integer
        running_task_count:
          type: integer
        failed_task_count:
          type: integer
        status:
          type: string
          enum:
