          in: path
          required: true
          schema: *a34
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checksum: *a34
              additionalProperties: false
      responses:
        "200":
          description: Operation result in the standard data envelope
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - url
                      - headers
                      - expires_at
                    properties:
                      url: &a35
                        type: string
                      headers:
                        type: object
                        additionalProperties: *a35
                      expires_at:
                        type: string
                        format: date-time
