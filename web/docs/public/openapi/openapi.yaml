  /api/open/v1/image-models:
    get:
      tags:
        - Developer API
      operationId: list_image_models
      summary: list image models
      description: Requires models:read. Available model capabilities for the current user groups; do not hardcode parameters.
      security:
        - developerBearerAuth: []
      x-required-scopes:
        - models:read
      responses:
        "200":
          description: Operation result in the standard data envelope
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: &a21
                          type: object
                          properties:
                            native_image_layer_pricing_confirmed:
                              type: boolean
                              description: All usable route candidates support layers and have valid, explicitly confirmed cost and sale layer pricing.
                            capabilities_by_task_type:
                              type: object
                              additionalProperties:
                                $ref: ./components/schemas/agent.yaml#/components/schemas/CapabilityTaskOptions
                            native_image_profile:
                              $ref: ./components/schemas/common.yaml#/components/schemas/NativeImageCapabilityProfile
                          additionalProperties: true
                      model_groups:
                        type: array
                        items: *a21
                      route_model_groups:
                        type: array
                        items: *a21
                      reference_image_max_bytes:
                        type: integer
                      reference_image_allowed_mime_types:
                        type: array
                        items:
                          type: string
