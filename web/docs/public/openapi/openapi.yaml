openapi: 3.1.0
info:
  title: Pic Gallery Developer API
  version: 0.2.0
  description: Unified Bearer developer API, OpenAI-compatible images, OAuth MCP, public gallery and separately authenticated callbacks. Generated from api/openapi; do not edit this copy.
servers:
  - url: http://localhost:8080
    description: Local API server
tags:
  - name: Open Image API
  - name: OpenAI Compat
  - name: Developer API
  - name: OAuth
  - name: MCP
paths:
  /api/open/video/v1/provider-callbacks/{provider_code}/{account_public_id}:
    post:
      tags:
        - Open Media
      summary: Receive a signed callback from a configured video provider account
      operationId: receiveVideoProviderCallback
      parameters:
        - name: provider_code
          in: path
          required: true
          schema:
            type: string
            enum:
              - seedance
              - minimax
        - name: account_public_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Provider challenge response
        "202":
          description: Verified callback accepted idempotently
        "400":
          description: Invalid signature or callback payload
        "404":
          description: Callback endpoint not found
  /api/open/image/v1/gallery/images:
    get:
      tags:
        - Open Image API
      summary: List public gallery images
      operationId: getOpenGalleryImages
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - latest
              - hot
        - name: query
          in: query
          description: Keyword search over public image ID, prompt excerpt, model, task type, and author. Full prompts remain hidden from list responses.
          schema:
            type: string
        - name: route_model_code
          in: query
          schema:
            type: string
        - name: task_type
          in: query
          schema:
            type: string
        - name: liked
          in: query
          schema:
            type: boolean
        - name: favorited
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Public gallery images
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/PublicGalleryListResponse
  /api/open/image/v1/gallery/images/{image_id}:
    get:
      tags:
        - Open Image API
      summary: Get public gallery image detail
      operationId: getOpenGalleryImageDetail
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public gallery image detail
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/PublicGalleryDetailResponse
        "401":
          description: Login required for full prompt and viewer interaction state
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/open/image/v1/gallery/images/{image_id}/access:
    get:
      tags:
        - Open Image API
      summary: Project a fresh direct-storage URL for an approved public image
      operationId: getOpenGalleryImageAccess
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum:
              - preview
              - download
      responses:
        "200":
          description: Short-lived URL for an approved public image
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - url
                    properties:
                      url:
                        type: string
                        format: uri-reference
                      expires_at:
                        type: string
                        format: date-time
        "404":
          description: Image is not approved for public access
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/open/image/v1/payments/webhooks/{channel}:
    post:
      tags:
        - Open Image API
      summary: Payment provider webhook callback
      operationId: postOpenPaymentWebhook
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum:
              - alipay
              - wxpay
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/SuccessEnvelope
  /v1/images/generations:
    post:
      tags:
        - OpenAI Compat
      summary: OpenAI-compatible image generation endpoint
      operationId: postOpenAIImageGeneration
      security:
        - developerBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/openai-compat.yaml#/components/schemas/OpenAIImageGenerationRequest
      responses:
        "200":
          description: OpenAI-compatible image generation response
          content:
            application/json:
              schema:
                $ref: ./components/schemas/openai-compat.yaml#/components/schemas/OpenAIImageResponse
            text/event-stream:
              schema:
                type: string
              description: Platform lifecycle and final results; never simulated partial images.
          headers:
            X-Task-ID:
              schema:
                type: string
            Location:
              schema:
                type: string
            X-Stream-Protocol:
              schema:
                type: string
        "504":
          description: "TASK_WAIT_INTERRUPTED: durable task retained. Recover using X-Task-ID and Location headers."
          headers:
            X-Task-ID:
              schema: &a1
                type: string
            Location:
              schema: *a1
      description: "Bearer API Key; synchronous result by default. Waits up to two minutes; 504 TASK_WAIT_INTERRUPTED retains the durable task. X-Task-ID and Location identify recovery. stream=true emits task and result events (successful result followed by data: [DONE]), or an error event ending the stream; X-Stream-Protocol: platform-image-lifecycle-v1. This is a platform extension, not OpenAI partial-image streaming. partial_images is explicitly unsupported. Native tasks are the canonical persistent async mechanism."
  /v1/images/edits:
    post:
      tags:
        - OpenAI Compat
      summary: OpenAI-compatible image edit endpoint
      operationId: postOpenAIImageEdit
      security:
        - developerBearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: ./components/schemas/openai-compat.yaml#/components/schemas/OpenAIImageEditRequest
      responses:
        "200":
          description: OpenAI-compatible image edit response
          content:
            application/json:
              schema:
                $ref: ./components/schemas/openai-compat.yaml#/components/schemas/OpenAIImageResponse
            text/event-stream:
              schema:
                type: string
              description: Platform lifecycle and final results; never simulated partial images.
          headers:
            X-Task-ID:
              schema:
                type: string
            Location:
              schema:
                type: string
            X-Stream-Protocol:
              schema:
                type: string
        "504":
          description: "TASK_WAIT_INTERRUPTED: durable task retained. Recover using X-Task-ID and Location headers."
          headers:
            X-Task-ID:
              schema: &a2
                type: string
            Location:
              schema: *a2
      description: "Bearer API Key; synchronous result by default. Waits up to two minutes; 504 TASK_WAIT_INTERRUPTED retains the durable task. X-Task-ID and Location identify recovery. stream=true emits task and result events (successful result followed by data: [DONE]), or an error event ending the stream; X-Stream-Protocol: platform-image-lifecycle-v1. This is a platform extension, not OpenAI partial-image streaming. partial_images is explicitly unsupported. Native tasks are the canonical persistent async mechanism."
  /v1/models:
    get:
      tags:
        - OpenAI Compat
      summary: OpenAI-compatible model list
      operationId: getOpenAIModels
      security:
        - developerBearerAuth: []
      responses:
        "200":
          description: OpenAI-compatible models
          content:
            application/json:
              schema:
                $ref: ./components/schemas/openai-compat.yaml#/components/schemas/OpenAIModelListResponse
  /api/public/v1/media:
    get:
      tags:
        - Public Gallery
      operationId: listPublicMedia
      summary: List approved public images and ready approved videos together
      security: []
      description: Anonymous public summary feed with optional browser identity for liked/favorited filters. Excludes deleted media and full prompts. latest sorts by published_at, created_at, id and media type descending; hot first uses image likes*2 + favorites*3 (videos score zero), followed by the same stable order. gallery_enabled=false returns an empty list. Detail and access permissions remain on the existing image/video endpoints.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - latest
              - hot
            default: latest
        - name: query
          in: query
          schema:
            type: string
        - name: route_model_code
          in: query
          schema:
            type: string
        - name: liked
          in: query
          description: Only liked images for the optional browser user. Anonymous requests with this filter return no items.
          schema:
            type: boolean
        - name: favorited
          in: query
          description: Only favorited images for the optional browser user. Anonymous requests with this filter return no items.
          schema:
            type: boolean
      responses:
        "200":
          description: Unified media page; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMediaPageResponse"
        "400":
          description: Invalid pagination
        "503":
          description: Public feed service unavailable
  /api/public/v1/videos:
    get:
      tags:
        - Public Media
      summary: List approved public videos
      operationId: listPublicVideos
      security: []
      description: Anonymous access; only approved videos. Page values below one become one; page_size below one becomes 20 and values above 100 are capped. Cache-Control is no-store.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: List approved public videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVideoPageResponse"
        "503":
          description: Video publication service unavailable
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
  /api/public/v1/videos/{asset_id}:
    get:
      tags:
        - Public Media
      summary: Get approved public video
      operationId: getPublicVideo
      security: []
      description: Anonymous approved-only projection; omits owner, project, review reason and execution metadata. Cache-Control is no-store.
      parameters: &a3
        - &a4
          name: asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Get approved public video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVideoResponse"
        "404":
          description: Video not found or inaccessible
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
        "503":
          description: Video publication service unavailable
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
    head:
      tags:
        - Public Media
      summary: Get approved public video headers
      operationId: headPublicVideo
      security: []
      description: Anonymous approved-only projection; omits owner, project, review reason and execution metadata. Cache-Control is no-store. HEAD returns no response body.
      parameters: *a3
      responses:
        "200":
          description: Get approved public video headers
        "404":
          description: Video not found or inaccessible
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
        "503":
          description: Video publication service unavailable
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
  /api/public/v1/videos/{asset_id}/video:
    get:
      tags:
        - Public Media
      summary: Read video video content
      operationId: getPublicVideo
      security: []
      description: Anonymous; requires approved visibility. Streams stored derivative bytes; never redirects. HEAD returns the same status and headers without a body. Cache-Control is no-store.
      parameters:
        - *a4
        - name: Range
          in: header
          schema:
            type: string
            description: "One bytes range: start-end, start-, or -suffix. Multiple ranges are rejected."
      responses:
        "200":
          description: Complete content
          headers:
            Accept-Ranges: &a5
              schema:
                type: string
                enum:
                  - bytes
            Content-Length: &a6
              schema:
                type: integer
                format: int64
            Cache-Control: &a7
              schema:
                type: string
                enum:
                  - no-store
            X-Content-Type-Options: &a8
              schema:
                type: string
                enum:
                  - nosniff
          content:
            video/*:
              schema:
                type: string
                format: binary
        "206":
          description: Requested single byte range
          headers:
            Accept-Ranges: *a5
            Content-Length: *a6
            Cache-Control: *a7
            X-Content-Type-Options: *a8
            Content-Range:
              schema:
                type: string
              description: bytes start-end/size
          content:
            video/*:
              schema:
                type: string
                format: binary
        "404":
          description: Video not found or inaccessible
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
        "416":
          description: Invalid, multiple, or unsatisfiable range; empty response body
          headers:
            Content-Range:
              schema:
                type: string
              description: bytes */size
        "503":
          description: Video publication service unavailable
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
    head:
      tags:
        - Public Media
      summary: Inspect video video content
      operationId: headPublicVideo
      security: []
      description: Anonymous; requires approved visibility. Streams stored derivative bytes; never redirects. HEAD returns the same status and headers without a body. Cache-Control is no-store.
      parameters:
        - *a4
        - name: Range
          in: header
          schema:
            type: string
            description: "One bytes range: start-end, start-, or -suffix. Multiple ranges are rejected."
      responses:
        "200":
          description: Complete content
          headers:
            Accept-Ranges: &a9
              schema:
                type: string
                enum:
                  - bytes
            Content-Length: &a10
              schema:
                type: integer
                format: int64
            Cache-Control: &a11
              schema:
                type: string
                enum:
                  - no-store
            X-Content-Type-Options: &a12
              schema:
                type: string
                enum:
                  - nosniff
        "206":
          description: Requested single byte range
          headers:
            Accept-Ranges: *a9
            Content-Length: *a10
            Cache-Control: *a11
            X-Content-Type-Options: *a12
            Content-Range:
              schema:
                type: string
              description: bytes start-end/size
        "404":
          description: Video not found or inaccessible
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
        "416":
          description: Invalid, multiple, or unsatisfiable range; empty response body
          headers:
            Content-Range:
              schema:
                type: string
              description: bytes */size
        "503":
          description: Video publication service unavailable
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/components/schemas/ErrorEnvelope
