            models:read: models read
            images:read: images read
            images:write: images write
            videos:read: videos read
            videos:write: videos write
            videos:delete: videos delete
            assets:read: assets read
            assets:write: assets write
            assets:delete: assets delete
            uploads:read: uploads read
            uploads:write: uploads write
            uploads:delete: uploads delete
            projects:read: projects read
            projects:write: projects write
            projects:delete: projects delete
            groups:read: groups read
            groups:write: groups write
            groups:delete: groups delete
