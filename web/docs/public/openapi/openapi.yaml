              type: number
            y:
              type: number
        size:
          type: object
          required:
            - width
            - height
          properties:
            width:
              type: number
            height:
              type: number
        payload:
          type: object
          description: Integrated nodes use name as a stable reference alias, title as an editable display name, and draft for generation parameters. Incoming edges supply media; canonical prompt references bind by source payload.name, never title. URLs, provider secrets and embedded binary data must not be persisted.
          properties:
            name:
              type: string
              description: Stable input reference alias
            title:
              type: string
              description: Editable display title
            draft:
              type: object
              description: Existing image/video request fields; video quote_token is returned by estimate detail.quote_token and persisted here before generate. Media inputs and reference bindings are derived from edges.
              properties:
                prompt_template:
                  type: string
                  description: Canonical {{$variable}} and {{@alias}} tokens; ${variable} is also accepted.
                variables:
                  type: object
                  additionalProperties:
                    type: string
                quote_token:
                  type: string
              additionalProperties: true
