        "500":
          description: Operation unavailable or internal error
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
  /api/open/v1/me/balance:
    get:
      tags:
        - Developer API
      operationId: get_balance
      summary: get balance
      description: Requires account:read.
      security:
        - developerBearerAuth: []
      x-required-scopes:
        - account:read
      responses:
        "200":
          description: Operation result in the standard data envelope
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: ./components/schemas/agent.yaml#/components/schemas/BalanceSummary
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                    additionalProperties: true
        "400":
          description: Invalid input or unsupported parameter
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        "401":
