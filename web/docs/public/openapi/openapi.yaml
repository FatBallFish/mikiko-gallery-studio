                type: string
                enum:
                  - bytes
            Content-Length: &a14
              schema:
                type: integer
                format: int64
            Cache-Control: &a15
              schema:
                type: string
                enum:
                  - no-store
            X-Content-Type-Options: &a16
              schema:
                type: string
                enum:
                  - nosniff
          content:
            image/*:
              schema:
                type: string
                format: binary
        "206":
          description: Requested single byte range
          headers:
            Accept-Ranges: *a13
            Content-Length: *a14
            Cache-Control: *a15
