  /api/open/v1/upload-access/{upload_id}/parts/{part_number}:
    put:
      tags:
        - Developer API
      operationId: upload_capability_part
      summary: Upload local multipart bytes using a returned capability
      description: Use the URL and headers from get_upload_part_url. No API Key or OAuth token is needed. The capability binds the current credential, owner, upload session, part, PUT method, audience, size, checksum and expiry. Query parameters are rejected. The session and credential must still be writable and authorized.
      security: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: part_number
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: X-Upload-Capability
          in: header
          required: true
          schema:
            type: string
        - name: X-Checksum-SHA256
          in: header
          required: true
          schema:
            type: string
        - name: Content-Length
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 33554432
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Completed part (part_number, etag, checksum and size_bytes) in the standard data envelope
        "400":
          description: Invalid length, checksum, bytes or query parameters
        "401":
          description: Credential or account no longer available
        "403":
          description: Invalid, expired or revoked capability, or session no longer writable
        "404":
          description: Session not found or not owned
        "405":
          description: PUT required
