  /api/open/v1/me:
    get:
      tags:
        - Developer API
      operationId: get_current_user
      summary: get current user
      description: Requires account:read.
      security:
        - developerBearerAuth: []
      x-required-scopes:
        - account:read
      responses:
        "200":
          description: Operation result in the standard data envelope
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/DeveloperCurrentUser"
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                    additionalProperties: true
        "400":
          description: Invalid input or unsupported parameter
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        "401":
          description: Missing, expired, revoked or disabled credential/account
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        "402":
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        "403":
          description: Required scope or quota not available
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        "404":
          description: Resource not found or not owned
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        "409":
          description: Version conflict, IDEMPOTENCY_CONFLICT or QUOTE_STALE
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
        "429":
