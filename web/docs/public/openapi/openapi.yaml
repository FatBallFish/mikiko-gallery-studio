        "429":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Rate limit exceeded
        "500":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Operation unavailable or internal error
        "503":
          content:
            application/json:
              schema:
                $ref: ./components/error-components.yaml#/components/schemas/ErrorResponse
          description: Native API error; see error.code and meta.request_id.
  /api/open/v1/image-models:
    get:
      tags:
        - Developer API
      operationId: list_image_models
      summary: list image models
      description: Requires models:read. Available model capabilities for the current user groups; do not hardcode parameters.
      security:
        - developerBearerAuth: []
      x-required-scopes:
        - models:read
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    $ref: ./components/schemas/native.generated.json#/$defs/list_image_modelsOutput
                  meta:
                    properties:
                      request_id:
                        type: string
                    required:
                      - request_id
                    type: object
                required:
                  - data
                  - meta
