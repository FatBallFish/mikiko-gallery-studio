app:
  name: pic-gallery
  env: prod
  addr: :8080

database:
  url: postgres://pic_gallery:CHANGE_ME_DB_PASSWORD@middleware.example.internal:5432/pic_gallery?sslmode=disable
  max_open_conns: 30
  max_idle_conns: 10
  conn_max_lifetime: 15m

redis:
  url: redis://:CHANGE_ME_REDIS_PASSWORD@middleware.example.internal:6379/0

storage:
  driver: s3
  local_root: /var/lib/pic-gallery/storage
  public_base_url: https://api.example.com/files
  shared_volume: true
  s3:
    endpoint: https://bfss.example.com
    region: us-east-1
    bucket: pic-gallery-assets
    access_key_id: CHANGE_ME_BFSS_ACCESS_KEY_ID
    secret_access_key: CHANGE_ME_BFSS_SECRET_ACCESS_KEY
    force_path_style: true
    prefix: pic-gallery/prod

auth:
  access_token_ttl: 10m
  refresh_token_ttl: 2h
  issuer: pic-gallery
  access_token_secret: CHANGE_ME_AT_LEAST_32_BYTES_ACCESS_TOKEN_SECRET
  refresh_cookie_name: pg_refresh_token
  fixed_email_code: ""
  dev_email_codes: false
  smtp:
    host: smtp.example.com
    port: 587
    username: CHANGE_ME_SMTP_USERNAME
    password: CHANGE_ME_SMTP_PASSWORD
    from: Pic Gallery <noreply@example.com>
    starttls: true
    insecure_skip_verify: false

admin:
  seed_email: admin@example.com
  seed_password: CHANGE_ME_ADMIN_PASSWORD
  seed_role: super_admin

api_key:
  signing_secret_encryption_key: CHANGE_ME_32_BYTE_API_KEY_SIGNING_SECRET

http:
  cors_allowed_origins:
    - https://www.example.com
    - https://admin.example.com

billing:
  cny_per_point: "0.31250"
  points_scale: 5
  signup_trial:
    enabled: true
    points: "20.00000"
    valid_days: 7
    expiry_reminder_days: 2
    grant_once_per_user: true
  auto_quality_default_by_group:
    basic: 1k
    plus: 2k
    pro: 4k
  quality_points_by_model:
    basic:
      1k: "2.00000"
      2k: "4.00000"
      4k: "8.00000"
    plus:
      1k: "5.00000"
      2k: "8.00000"
      4k: "16.00000"
    pro:
      1k: "8.00000"
      2k: "12.00000"
      4k: "20.00000"
  user_group_multipliers:
    basic: "1.00000"
    plus: "1.00000"
    pro: "1.00000"
  task_multipliers:
    text_to_image: "1.00000"
    image_edit: "1.25000"
    reference_generate: "1.15000"
  reference_image_extra:
    first: "0.10000"
    additional: "0.05000"

cashier:
  enabled: true
  mock_enabled: false
  order_timeout_seconds: 1800
  max_pending_orders_per_user: 3
  site_base_url: https://www.example.com
  provider_config_encryption_key: CHANGE_ME_32_BYTE_CASHIER_CONFIG_SECRET

security:
  secure_config_encryption_key: CHANGE_ME_32_BYTE_SECURE_CONFIG_SECRET

generation_limits:
  max_image_count: 5
  reference_image_max_mb: 10
  reference_image_max_count: 4
  prompt_max_chars: 4000
  negative_prompt_max_chars: 1000

providers:
  openai:
    enabled: true
    base_url: https://api.openai.com/v1
    api_key: CHANGE_ME_OPENAI_API_KEY
  openrouter:
    enabled: true
    base_url: https://openrouter.ai/api/v1
    api_key: CHANGE_ME_OPENROUTER_API_KEY

routing:
  default_provider: openai
  fallback_providers:
    - openrouter
  openai_compat_model_map:
    gpt-image-2: plus
  provider_model_map:
    basic:
      openai: gpt-image-1
      openrouter: openai/gpt-image-1
    plus:
      openai: gpt-image-1
      openrouter: openai/gpt-image-1
    pro:
      openai: gpt-image-1
      openrouter: openai/gpt-image-1
  provider_capabilities:
    openai:
      supported_models: [basic, plus, pro]
      supported_task_types: [text_to_image, image_edit, reference_generate]
      supported_qualities: [1k, 2k, 4k]
      supported_aspect_ratios: ["1:1", "4:3", "16:9"]
      max_image_count: 5
      max_reference_image_count: 4
      supports_image_input: true
      supports_mask: true
      priority: 1
    openrouter:
      supported_models: [basic, plus, pro]
      supported_task_types: [text_to_image, image_edit, reference_generate]
      supported_qualities: [1k, 2k, 4k]
      supported_aspect_ratios: ["1:1", "4:3", "16:9"]
      max_image_count: 5
      max_reference_image_count: 4
      supports_image_input: true
      supports_mask: false
      priority: 2

worker:
  max_concurrent_tasks: 30

docs:
  title: Pic Gallery API Docs
  base_path: /developers/docs
