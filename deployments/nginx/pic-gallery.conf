upstream pic_gallery_api { server api:8080; }
upstream pic_gallery_docs_web { server docs-web:80; }
server {
  listen 80;
  server_name _;
  client_max_body_size 20m;
  location = /developer-docs { return 301 /developer-docs/$is_args$args; }
  location /developer-docs/ { proxy_pass http://pic_gallery_docs_web/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location / { proxy_pass http://pic_gallery_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
