server {
    listen 80;
    server_name _;
    root /opt/pic-gallery/admin-web/dist;
    index index.html;

    location = /env.js {
        try_files /env.js =404;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /admin/env.js {
        alias /opt/pic-gallery/admin-web/dist/env.js;
        add_header Cache-Control "no-store";
    }

    location /admin/assets/ {
        alias /opt/pic-gallery/admin-web/dist/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
