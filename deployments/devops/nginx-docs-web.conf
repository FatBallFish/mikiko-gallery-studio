server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /openapi/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
        default_type application/yaml;
    }

    location ~* \.(?:js|css|map|json|wasm|woff2?|ttf|svg|png|jpe?g|gif|webp|ico|ya?ml)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
