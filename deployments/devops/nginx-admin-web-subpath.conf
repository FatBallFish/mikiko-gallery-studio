server {
    listen 80;
    server_name _;
    root /opt/pic-gallery/user-web/dist;
    index index.html;

    location = /env.js {
        add_header Cache-Control "no-store";
        try_files /env.js =404;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /admin/env.js {
        alias /opt/pic-gallery/admin-web/dist/env.js;
        add_header Cache-Control "no-store";
    }

    location /admin/ {
        alias /opt/pic-gallery/admin-web/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
