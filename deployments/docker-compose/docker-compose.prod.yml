name: ${COMPOSE_PROJECT_NAME:-pic-gallery-prod}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pic_gallery}
      POSTGRES_USER: ${POSTGRES_USER:-pic_gallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pic_gallery} -d ${POSTGRES_DB:-pic_gallery}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${PIC_GALLERY_IMAGE_REGISTRY:-docker.io/your-org}/pic-gallery-api:${PIC_GALLERY_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PIC_GALLERY_ENV: ${PIC_GALLERY_ENV:-production}
      PIC_GALLERY_ADDR: ${PIC_GALLERY_ADDR:-:8080}
      PIC_GALLERY_TIMEZONE: ${PIC_GALLERY_TIMEZONE:-Asia/Shanghai}
      DATABASE_URL: postgres://${POSTGRES_USER:-pic_gallery}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}@postgres:5432/${POSTGRES_DB:-pic_gallery}?sslmode=disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-20}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-10}
      DATABASE_CONN_MAX_LIFETIME: ${DATABASE_CONN_MAX_LIFETIME:-30m}
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-pic-gallery}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/var/lib/pic-gallery/storage}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      STORAGE_SHARED_VOLUME: ${STORAGE_SHARED_VOLUME:-true}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?set AUTH_ACCESS_TOKEN_SECRET in the env file}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-10m}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-30m}
      AUTH_ISSUER: ${AUTH_ISSUER:-pic-gallery}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-pg_refresh_token}
      API_KEY_SIGNING_SECRET_ENCRYPTION_KEY: ${API_KEY_SIGNING_SECRET_ENCRYPTION_KEY:?set API_KEY_SIGNING_SECRET_ENCRYPTION_KEY in the env file}
      CASHIER_PROVIDER_CONFIG_ENCRYPTION_KEY: ${CASHIER_PROVIDER_CONFIG_ENCRYPTION_KEY:?set CASHIER_PROVIDER_CONFIG_ENCRYPTION_KEY in the env file}
      PIC_GALLERY_SECURE_CONFIG_ENCRYPTION_KEY: ${PIC_GALLERY_SECURE_CONFIG_ENCRYPTION_KEY:?set PIC_GALLERY_SECURE_CONFIG_ENCRYPTION_KEY in the env file}
      PIC_GALLERY_ADMIN_EMAIL: ${PIC_GALLERY_ADMIN_EMAIL:-}
      PIC_GALLERY_ADMIN_PASSWORD: ${PIC_GALLERY_ADMIN_PASSWORD:-}
      PIC_GALLERY_ADMIN_ROLE: ${PIC_GALLERY_ADMIN_ROLE:-super_admin}
      WORKER_MAX_CONCURRENT_TASKS: ${WORKER_MAX_CONCURRENT_TASKS:-4}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - shared-storage:/var/lib/pic-gallery/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    image: ${PIC_GALLERY_IMAGE_REGISTRY:-docker.io/your-org}/pic-gallery-worker:${PIC_GALLERY_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PIC_GALLERY_ENV: ${PIC_GALLERY_ENV:-production}
      PIC_GALLERY_ADDR: ${PIC_GALLERY_ADDR:-:8080}
      PIC_GALLERY_TIMEZONE: ${PIC_GALLERY_TIMEZONE:-Asia/Shanghai}
      DATABASE_URL: postgres://${POSTGRES_USER:-pic_gallery}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}@postgres:5432/${POSTGRES_DB:-pic_gallery}?sslmode=disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-20}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-10}
      DATABASE_CONN_MAX_LIFETIME: ${DATABASE_CONN_MAX_LIFETIME:-30m}
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-pic-gallery}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/var/lib/pic-gallery/storage}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      STORAGE_SHARED_VOLUME: ${STORAGE_SHARED_VOLUME:-true}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?set AUTH_ACCESS_TOKEN_SECRET in the env file}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-10m}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-30m}
      AUTH_ISSUER: ${AUTH_ISSUER:-pic-gallery}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-pg_refresh_token}
      API_KEY_SIGNING_SECRET_ENCRYPTION_KEY: ${API_KEY_SIGNING_SECRET_ENCRYPTION_KEY:?set API_KEY_SIGNING_SECRET_ENCRYPTION_KEY in the env file}
      CASHIER_PROVIDER_CONFIG_ENCRYPTION_KEY: ${CASHIER_PROVIDER_CONFIG_ENCRYPTION_KEY:?set CASHIER_PROVIDER_CONFIG_ENCRYPTION_KEY in the env file}
      PIC_GALLERY_SECURE_CONFIG_ENCRYPTION_KEY: ${PIC_GALLERY_SECURE_CONFIG_ENCRYPTION_KEY:?set PIC_GALLERY_SECURE_CONFIG_ENCRYPTION_KEY in the env file}
      WORKER_MAX_CONCURRENT_TASKS: ${WORKER_MAX_CONCURRENT_TASKS:-4}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - shared-storage:/var/lib/pic-gallery/storage

  user-web:
    image: ${PIC_GALLERY_IMAGE_REGISTRY:-docker.io/your-org}/pic-gallery-user-web:${PIC_GALLERY_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PIC_GALLERY_DOCS_URL: ${PIC_GALLERY_DOCS_URL:-/developer-docs/}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

  docs-web:
    image: ${PIC_GALLERY_IMAGE_REGISTRY:-docker.io/your-org}/pic-gallery-docs-web:${PIC_GALLERY_IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

  admin-web:
    image: ${PIC_GALLERY_IMAGE_REGISTRY:-docker.io/your-org}/pic-gallery-admin-web:${PIC_GALLERY_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        restart: true
      user-web:
        condition: service_healthy
        restart: true
      admin-web:
        condition: service_healthy
        restart: true
      docs-web:
        condition: service_healthy
        restart: true
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

volumes:
  postgres-data:
  redis-data:
  shared-storage:
  prometheus-data:
