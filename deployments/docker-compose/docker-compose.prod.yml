name: ${COMPOSE_PROJECT_NAME:-pic-gallery-prod}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pic_gallery}
      POSTGRES_USER: ${POSTGRES_USER:-pic_gallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pic_gallery} -d ${POSTGRES_DB:-pic_gallery}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    image: pic-gallery-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${PIC_GALLERY_CONFIG_FILE:-../../configs/config.compose.prod.yaml}:/app/config.yaml:ro
      - shared-storage:/var/lib/pic-gallery/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    image: pic-gallery-worker:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${PIC_GALLERY_CONFIG_FILE:-../../configs/config.compose.prod.yaml}:/app/config.yaml:ro
      - shared-storage:/var/lib/pic-gallery/storage

  user-web:
    build:
      context: ../..
      dockerfile: Dockerfile.user-web
      args:
        VITE_API_BASE_URL: ""
        VITE_BASE_PATH: /
    image: pic-gallery-user-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

  admin-web:
    build:
      context: ../..
      dockerfile: Dockerfile.admin-web
      args:
        VITE_API_BASE_URL: ""
        VITE_BASE_PATH: /admin/
    image: pic-gallery-admin-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        restart: true
      user-web:
        condition: service_healthy
        restart: true
      admin-web:
        condition: service_healthy
        restart: true
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

volumes:
  postgres-data:
  redis-data:
  shared-storage:
  prometheus-data:
