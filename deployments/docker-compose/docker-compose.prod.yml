x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  postgres:
    logging: *default-logging
    profiles: ["full", "postgres"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      APP_POSTGRES_USER: ${POSTGRES_USER:-}
      APP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cp /opt/deploy/postgres-init.sh /docker-entrypoint-initdb.d/10-app-role.sh
        chown postgres:postgres /docker-entrypoint-initdb.d/10-app-role.sh
        chmod 0700 /docker-entrypoint-initdb.d/10-app-role.sh
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${MGSCTL_RUNTIME_DIR:-.}/assets/postgres-init.sh
        target: /opt/deploy/postgres-init.sh
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    logging: *default-logging
    profiles: ["full", "redis"]
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs:
    logging: *default-logging
    profiles: ["full", "rustfs"]
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      # /health/ready turns 200 only after storage and IAM are initialized,
      # which also gates the rustfs-init bucket job via service_healthy.
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs-init:
    logging: *default-logging
    profiles: ["full", "rustfs"]
    image: amazon/aws-cli:2.37.12
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
    entrypoint: ["/bin/sh", "/opt/deploy/rustfs-init.sh"]
    volumes:
      - type: bind
        source: ${MGSCTL_RUNTIME_DIR:-.}/assets/rustfs-init.sh
        target: /opt/deploy/rustfs-init.sh
        read_only: true

  api:
    logging: *default-logging
    profiles: ["full", "core", "api"]
    image: ${IMAGE_REGISTRY:-docker.io/fatballfish}/mikiko-gallery-studio-api:${IMAGE_TAG:-latest}
    user: ${MGSCTL_RUNTIME_USER:-picgallery}
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${MGSCTL_RUNTIME_DIR:-.}/config
        target: /app/config
      - type: bind
        source: ${MGSCTL_RUNTIME_DIR:-.}/data
        target: /app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${API_PORT:-8080}/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    logging: *default-logging
    profiles: ["full", "core", "worker"]
    image: ${IMAGE_REGISTRY:-docker.io/fatballfish}/mikiko-gallery-studio-worker:${IMAGE_TAG:-latest}
    user: ${MGSCTL_RUNTIME_USER:-picgallery}
    working_dir: /app
    restart: unless-stopped
    expose:
      - "9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${MGSCTL_RUNTIME_DIR:-.}/config
        target: /app/config
        read_only: true
      - type: bind
        source: ${MGSCTL_RUNTIME_DIR:-.}/data
        target: /app/data

  user-web:
    logging: *default-logging
    profiles: ["full", "core", "user-web"]
    image: ${IMAGE_REGISTRY:-docker.io/fatballfish}/mikiko-gallery-studio-user-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${USER_WEB_PORT:-5173}:80"
    environment:
      PIC_GALLERY_API_BASE_URL: ${PUBLIC_API_URL:-}
      PIC_GALLERY_API_PORT: ${API_PORT:-8080}
      PIC_GALLERY_DIRECT_FRONTEND_PORT: ${USER_WEB_PORT:-5173}
      PIC_GALLERY_DOCS_URL: ${PIC_GALLERY_DOCS_URL:-/developer-docs/}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20

  admin-web:
    logging: *default-logging
    profiles: ["full", "core", "admin-web"]
    image: ${IMAGE_REGISTRY:-docker.io/fatballfish}/mikiko-gallery-studio-admin-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${ADMIN_WEB_PORT:-5174}:80"
    environment:
      PIC_GALLERY_API_BASE_URL: ${PUBLIC_API_URL:-}
      PIC_GALLERY_API_PORT: ${API_PORT:-8080}
      PIC_GALLERY_DIRECT_FRONTEND_PORT: ${ADMIN_WEB_PORT:-5174}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20

  docs-web:
    logging: *default-logging
    profiles: ["full", "core", "docs-web"]
    image: ${IMAGE_REGISTRY:-docker.io/fatballfish}/mikiko-gallery-studio-docs-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${DOCS_WEB_PORT:-5175}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    logging: *default-logging
    profiles: ["full", "core", "gateway"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        required: false
      user-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      docs-web:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - type: bind
        source: ${MGSCTL_RUNTIME_DIR:-.}/assets/nginx-default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  monitoring:
    logging: *default-logging
    profiles: ["monitoring"]
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    ports:
      - "${MONITORING_PORT:-9090}:9090"
    volumes:
      - type: bind
        source: ${MGSCTL_RUNTIME_DIR:-.}/assets/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  rustfs-logs:
  prometheus-data:
