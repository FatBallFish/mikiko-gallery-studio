name: pic-gallery-e2e

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pic_gallery
      POSTGRES_USER: pic_gallery
      POSTGRES_PASSWORD: pic_gallery_e2e_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pic_gallery -d pic_gallery"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    image: golang:1.26.0-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -lc "/usr/local/go/bin/go run ./cmd/api"
    environment:
      CGO_ENABLED: "0"
      APP_CONFIG_PATH: configs/config.example.yaml
      APP_ENV: local
      APP_ADDR: :8080
      DATABASE_URL: postgres://pic_gallery:pic_gallery_e2e_password@postgres:5432/pic_gallery?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /var/lib/pic-gallery/storage
      STORAGE_SHARED_VOLUME: "true"
      AUTH_ACCESS_TOKEN_SECRET: local-compose-access-secret-change-me
      API_KEY_SIGNING_SECRET_ENCRYPTION_KEY: local-compose-api-key-encryption-secret-change-me
      CASHIER_PROVIDER_CONFIG_ENCRYPTION_KEY: local-compose-cashier-provider-secret-change-me
      PIC_GALLERY_SECURE_CONFIG_ENCRYPTION_KEY: local-compose-secure-config-secret-change-me
      PIC_GALLERY_AUTH_DEV_EMAIL_CODES: "true"
      PIC_GALLERY_ADMIN_EMAIL: admin@example.com
      PIC_GALLERY_ADMIN_PASSWORD: admin123456
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
    ports:
      - "${API_PORT:-18080}:8080"
    volumes:
      - ../../:/app
      - go-cache:/go
      - shared-storage:/var/lib/pic-gallery/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 20

  worker:
    image: golang:1.26.0-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -lc "/usr/local/go/bin/go run ./cmd/worker"
    environment:
      CGO_ENABLED: "0"
      APP_CONFIG_PATH: configs/config.example.yaml
      APP_ENV: local
      DATABASE_URL: postgres://pic_gallery:pic_gallery_e2e_password@postgres:5432/pic_gallery?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /var/lib/pic-gallery/storage
      STORAGE_SHARED_VOLUME: "true"
      AUTH_ACCESS_TOKEN_SECRET: local-compose-access-secret-change-me
      API_KEY_SIGNING_SECRET_ENCRYPTION_KEY: local-compose-api-key-encryption-secret-change-me
      CASHIER_PROVIDER_CONFIG_ENCRYPTION_KEY: local-compose-cashier-provider-secret-change-me
      PIC_GALLERY_SECURE_CONFIG_ENCRYPTION_KEY: local-compose-secure-config-secret-change-me
      PIC_GALLERY_AUTH_DEV_EMAIL_CODES: "true"
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
    volumes:
      - ../../:/app
      - go-cache:/go
      - shared-storage:/var/lib/pic-gallery/storage
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app/web/user
    command: sh -lc "npm ci && npm run dev"
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-18080}
      VITE_AUTH_DEFAULT_MODE: code
      VITE_DEFAULT_USER_EMAIL: user@example.com
      VITE_DEFAULT_USER_CODE: "123456"
    ports:
      - "${USER_WEB_PORT:-5173}:5173"
    volumes:
      - ../../:/app
      - user-node-modules:/app/web/user/node_modules
    depends_on:
      api:
        condition: service_healthy

  admin-web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app/web/admin
    command: sh -lc "npm ci && npm run dev"
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-18080}
      VITE_DEFAULT_ADMIN_EMAIL: admin@example.com
      VITE_DEFAULT_ADMIN_PASSWORD: admin123456
    ports:
      - "${ADMIN_WEB_PORT:-5174}:5174"
    volumes:
      - ../../:/app
      - admin-node-modules:/app/web/admin/node_modules
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-18081}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
  shared-storage:
  go-cache:
  user-node-modules:
  admin-node-modules:
