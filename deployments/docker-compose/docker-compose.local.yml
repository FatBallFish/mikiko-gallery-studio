name: pic-gallery-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pic_gallery
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pic_gallery"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 5

  bootstrap-local:
    image: mikiko-gallery-studio-api:${IMAGE_TAG:-dev}
    pull_policy: never
    restart: "no"
    user: "0:0"
    entrypoint: ["mikiko-gallery-studio-local-bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${PIC_GALLERY_LOCAL_CONFIG_DIR:-../../config}:/app/config

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    image: mikiko-gallery-studio-api:${IMAGE_TAG:-dev}
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/usr/local/bin/mikiko-gallery-studio-local-entrypoint"]
    command: ["mikiko-gallery-studio-api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap-local:
        condition: service_completed_successfully
    volumes:
      - ${PIC_GALLERY_LOCAL_CONFIG_DIR:-../../config}:/run/pic-gallery-config:ro
      - shared-storage:/var/lib/pic-gallery/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    image: mikiko-gallery-studio-worker:${IMAGE_TAG:-dev}
    restart: unless-stopped
    expose:
      - "9091"
    user: "0:0"
    entrypoint: ["/usr/local/bin/mikiko-gallery-studio-local-entrypoint"]
    command: ["mikiko-gallery-studio-worker"]
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap-local:
        condition: service_completed_successfully
    volumes:
      - ${PIC_GALLERY_LOCAL_CONFIG_DIR:-../../config}:/run/pic-gallery-config:ro
      - shared-storage:/var/lib/pic-gallery/storage
      - worker-temp:/var/lib/pic-gallery/tmp

  user-web:
    build:
      context: ../..
      dockerfile: Dockerfile.user-web
      args:
        VITE_API_BASE_URL: ""
        VITE_BASE_PATH: /
    image: mikiko-gallery-studio-user-web:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      PIC_GALLERY_API_BASE_URL: ${PUBLIC_API_URL:-}
      PIC_GALLERY_API_PORT: ${API_PORT:-8080}
      PIC_GALLERY_DIRECT_FRONTEND_PORT: ${USER_WEB_PORT:-5173}
      PIC_GALLERY_DOCS_URL: ${PIC_GALLERY_DOCS_URL:-/developer-docs/}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

  docs-web:
    build:
      context: ../..
      dockerfile: Dockerfile.docs-web
      args:
        VITE_BASE_PATH: ./
    image: mikiko-gallery-studio-docs-web:${IMAGE_TAG:-dev}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

  admin-web:
    build:
      context: ../..
      dockerfile: Dockerfile.admin-web
      args:
        VITE_API_BASE_URL: ""
        VITE_BASE_PATH: ./
    image: mikiko-gallery-studio-admin-web:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      PIC_GALLERY_API_BASE_URL: ${PUBLIC_API_URL:-}
      PIC_GALLERY_API_PORT: ${API_PORT:-8080}
      PIC_GALLERY_DIRECT_FRONTEND_PORT: ${ADMIN_WEB_PORT:-5174}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        restart: true
      user-web:
        condition: service_healthy
        restart: true
      admin-web:
        condition: service_healthy
        restart: true
      docs-web:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
  shared-storage:
  worker-temp:
