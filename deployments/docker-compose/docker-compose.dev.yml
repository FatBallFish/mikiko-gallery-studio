name: pic-gallery-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pic_gallery}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pic_gallery}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    image: pic-gallery-api:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PIC_GALLERY_ENV: local
      PIC_GALLERY_ADDR: :8080
      DATABASE_URL: postgres://postgres@postgres:5432/${POSTGRES_DB:-pic_gallery}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: pic-gallery
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /var/lib/pic-gallery/storage
      STORAGE_PUBLIC_BASE_URL: http://localhost:${DEV_NGINX_PORT:-8088}/files
      STORAGE_SHARED_VOLUME: "true"
      AUTH_ACCESS_TOKEN_SECRET: local-dev-secret
      AUTH_ACCESS_TOKEN_TTL: 10m
      AUTH_REFRESH_TOKEN_TTL: 2h
      API_KEY_SIGNING_SECRET_ENCRYPTION_KEY: local-dev-api-key-signing-secret-encryption-key
      CASHIER_PROVIDER_CONFIG_ENCRYPTION_KEY: local-dev-cashier-provider-config-encryption-key
      PIC_GALLERY_SECURE_CONFIG_ENCRYPTION_KEY: local-dev-secure-config-encryption-key
      PROMPT_OPTIMIZATION_QUOTE_SIGNING_KEY: local-dev-prompt-optimization-quote-signing-key
      PIC_GALLERY_ADMIN_EMAIL: ${PIC_GALLERY_ADMIN_EMAIL:-admin@example.com}
      PIC_GALLERY_ADMIN_PASSWORD: ${PIC_GALLERY_ADMIN_PASSWORD:-admin123456}
      PIC_GALLERY_ADMIN_ROLE: super_admin
      CASHIER_ENABLED: "true"
      CASHIER_MOCK_ENABLED: "true"
      CASHIER_SITE_BASE_URL: http://localhost:${DEV_NGINX_PORT:-8088}
      WORKER_MAX_CONCURRENT_TASKS: "4"
    volumes:
      - shared-storage:/var/lib/pic-gallery/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    image: pic-gallery-worker:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PIC_GALLERY_ENV: local
      PIC_GALLERY_ADDR: :8080
      DATABASE_URL: postgres://postgres@postgres:5432/${POSTGRES_DB:-pic_gallery}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: pic-gallery
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /var/lib/pic-gallery/storage
      STORAGE_PUBLIC_BASE_URL: http://localhost:${DEV_NGINX_PORT:-8088}/files
      STORAGE_SHARED_VOLUME: "true"
      AUTH_ACCESS_TOKEN_SECRET: local-dev-secret
      AUTH_ACCESS_TOKEN_TTL: 10m
      AUTH_REFRESH_TOKEN_TTL: 2h
      API_KEY_SIGNING_SECRET_ENCRYPTION_KEY: local-dev-api-key-signing-secret-encryption-key
      CASHIER_PROVIDER_CONFIG_ENCRYPTION_KEY: local-dev-cashier-provider-config-encryption-key
      PIC_GALLERY_SECURE_CONFIG_ENCRYPTION_KEY: local-dev-secure-config-encryption-key
      PROMPT_OPTIMIZATION_QUOTE_SIGNING_KEY: local-dev-prompt-optimization-quote-signing-key
      CASHIER_ENABLED: "true"
      CASHIER_MOCK_ENABLED: "true"
      CASHIER_SITE_BASE_URL: http://localhost:${DEV_NGINX_PORT:-8088}
      WORKER_MAX_CONCURRENT_TASKS: "4"
    volumes:
      - shared-storage:/var/lib/pic-gallery/storage

  user-web:
    build:
      context: ../..
      dockerfile: Dockerfile.user-web
      args:
        VITE_API_BASE_URL: ""
        VITE_BASE_PATH: /
    image: pic-gallery-user-web:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      PIC_GALLERY_DOCS_URL: ${PIC_GALLERY_DOCS_URL:-/developer-docs/}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

  docs-web:
    build:
      context: ../..
      dockerfile: Dockerfile.docs-web
      args:
        VITE_BASE_PATH: /developer-docs/
    image: pic-gallery-docs-web:${IMAGE_TAG:-dev}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

  admin-web:
    build:
      context: ../..
      dockerfile: Dockerfile.admin-web
      args:
        VITE_API_BASE_URL: ""
        VITE_BASE_PATH: /admin/
    image: pic-gallery-admin-web:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        restart: true
      user-web:
        condition: service_healthy
        restart: true
      admin-web:
        condition: service_healthy
        restart: true
      docs-web:
        condition: service_healthy
        restart: true
    ports:
      - "${DEV_NGINX_PORT:-8088}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
  shared-storage:
