global:
  scrape_interval: 15s

scrape_configs:
  - job_name: mikiko-gallery-studio-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: mikiko-gallery-studio-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9091
